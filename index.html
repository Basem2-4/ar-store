<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAMARIYAH STORE | متجر العامرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); }
        body { background-color: #050505; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; margin: 0; }
        .gold-gradient-text { background: linear-gradient(to bottom, #f9d976, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border: 1px solid var(--gold); }
        nav { background: rgba(0, 0, 0, 0.3) !important; backdrop-filter: blur(10px); border: 2px solid var(--gold) !important; margin: 15px 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* تحسينات القائمة العلوية */
        .nav-link { font-size: 1.1rem; transition: 0.3s; position: relative; }
        .nav-link.active { color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold-glow); }

        .admin-trigger { position: fixed; bottom: 10px; right: 10px; z-index: 9999; opacity: 0; transition: 0.5s; cursor: pointer; padding: 10px; }
        .admin-trigger:hover { opacity: 0.5; transform: rotate(90deg); color: var(--gold); }

        .section-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-size: cover; background-position: center; z-index: -1; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .active-bg { opacity: 1; }
        .content-section { display: none; padding-top: 20px; min-height: 100vh; }
        .admin-modal { background: rgba(10, 10, 10, 0.98); border: 1px solid var(--gold); border-radius: 15px; z-index: 6000; transition: 0.4s; }
        .btn-gold { background: linear-gradient(45deg, #aa8418, #d4af37); color: black; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--gold-glow); }
        input, select { background: rgba(20,20,20,0.9) !important; border: 1px solid #444 !important; color: white !important; padding: 8px; border-radius: 8px; width: 100%; font-size: 12px; }
        
        #cart-sidebar { position: fixed; left: 0; top: 0; width: 320px; height: 100%; background: rgba(5, 5, 5, 0.98); border-right: 2px solid var(--gold); transform: translateX(-100%); transition: 0.3s; z-index: 2000; padding: 20px; display: flex; flex-direction: column; }
        .discount-badge { background: #ff3e3e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8em; margin-left: 5px; }
        .timer-box { font-size: 10px; background: rgba(255, 62, 62, 0.2); color: #ff3e3e; padding: 2px 6px; border-radius: 4px; border: 1px solid #ff3e3e; margin-top: 5px; display: inline-block; }

        #notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast-notify { background: #111; border: 1px solid var(--gold); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .qty-btn { background: #1a1a1a; border: 1px solid #444; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-weight: bold; font-size: 14px; }
        
        .currency-btn { background: #111; border: 1px solid #333; padding: 4px 8px; border-radius: 5px; font-size: 10px; transition: 0.3s; }
        .currency-btn.active { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div id="notification-container"></div>
    <div class="admin-trigger" onclick="accessAdmin()"><i class="fas fa-cog fa-2x"></i></div>

    <div id="bg-main" class="section-bg active-bg"></div>
    <div id="bg-cars" class="section-bg"></div>
    <div id="bg-real" class="section-bg"></div>
    <div id="bg-shops" class="section-bg"></div>

    <div id="admin-panel" class="fixed left-0 top-0 h-full w-full md:w-[450px] admin-modal translate-x-[-100%] overflow-y-auto p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-gold pb-2">
            <h2 class="text-xl gold-gradient-text font-black">⚙️ الإدارة</h2>
            <button onclick="closeAdmin()" class="text-red-500 text-2xl">&times;</button>
        </div>

        <div class="mb-6 p-4 bg-zinc-900 rounded-lg border border-gold/20">
            <h3 class="text-gold text-sm mb-3 font-bold">🏢 إدارة شركات السيارات</h3>
            <div class="flex gap-2 mb-2">
                <input type="text" id="new-company-name" placeholder="اسم الشركة (مثلاً: لكزس)">
                <button onclick="addCompany()" class="bg-green-700 px-4 rounded text-xs">إضافة</button>
            </div>
            <select id="delete-company-select" class="mb-2"></select>
            <button onclick="deleteCompany()" class="w-full bg-red-900/50 text-red-500 py-1 rounded text-[10px]">حذف الشركة المختارة</button>
        </div>

        <div class="mb-6 p-4 bg-zinc-900 rounded-lg">
            <h3 class="text-gold text-sm mb-3 font-bold">📦 إضافة منتج جديد</h3>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="new-p-name" placeholder="الاسم">
                <input type="number" id="new-p-price" placeholder="السعر">
                <input type="number" id="new-p-stock" placeholder="المخزون">
                <input type="text" id="new-p-img" placeholder="رابط الصورة">
                <select id="new-p-cat" onchange="toggleAdminCompanySelect()" class="col-span-2">
                    <option value="main">قسم الرئيسية</option>
                    <option value="cars">قسم السيارات</option>
                    <option value="real">قسم العقارات</option>
                    <option value="shops">قسم المتاجر</option>
                </select>
                <div id="admin-company-div" class="hidden col-span-2">
                    <select id="new-p-company-select"></select>
                </div>
            </div>
            <button onclick="addProduct()" class="w-full btn-gold py-2 text-xs mt-3">حفظ المنتج ✅</button>
        </div>

        <div class="mb-6 p-4 bg-zinc-800 rounded-lg">
            <h3 class="text-blue-400 text-sm mb-3 font-bold">📝 تعديل منتج</h3>
            <select id="edit-cat-select" onchange="loadProductsToEdit()" class="mb-2">
                <option value="">اختر القسم لتعديله</option>
                <option value="main">الرئيسية</option>
                <option value="cars">السيارات</option>
                <option value="real">العقارات</option>
                <option value="shops">المتاجر</option>
            </select>
            <select id="edit-prod-select" class="hidden mb-2" onchange="fillEditData()"></select>
            <div id="edit-fields" class="hidden space-y-2 mt-2">
                <input type="text" id="edit-p-name" placeholder="الاسم">
                <input type="number" id="edit-p-price" placeholder="السعر">
                <input type="number" id="edit-p-stock" placeholder="المخزون">
                <input type="text" id="edit-p-img" placeholder="رابط الصورة">
                <button onclick="saveProductEdits()" class="w-full bg-blue-600 py-2 rounded text-xs">تحديث</button>
                <button onclick="deleteProduct()" class="w-full bg-red-800 py-2 rounded text-xs">حذف</button>
            </div>
        </div>

        <div class="mb-6 p-4 bg-red-900/10 border border-red-900/30 rounded-lg">
            <h3 class="text-red-500 text-sm mb-3 font-bold">🔥 نظام الخصومات والمؤقت</h3>
            <select id="disc-type" onchange="toggleDiscOptions()" class="mb-2">
                <option value="all">كل المتجر</option>
                <option value="cat">قسم معين</option>
                <option value="prod">منتج محدد</option>
                <option value="coupon">كود خصم</option>
            </select>
            <div id="disc-cat-div" class="hidden mb-2"><select id="disc-cat-val"><option value="main">الرئيسية</option><option value="cars">السيارات</option><option value="real">العقارات</option><option value="shops">المتاجر</option></select></div>
            <div id="disc-prod-div" class="hidden mb-2"><select id="disc-prod-val"></select></div>
            <div id="disc-coupon-div" class="hidden mb-2"><input type="text" id="disc-coupon-code" placeholder="كود الخصم"></div>
            <div class="flex gap-2">
                <input type="number" id="disc-percent" placeholder="النسبة %">
                <input type="number" id="disc-hours" placeholder="المدة/ساعة">
            </div>
            <button onclick="setDiscount()" class="w-full bg-red-700 text-white py-2 rounded text-xs mt-2">تفعيل الخصم</button>
        </div>

        <div class="p-4 bg-zinc-900 rounded-lg">
            <h3 class="text-gold text-sm mb-3">🖼️ روابط الخلفيات</h3>
            <input type="text" id="bg-main-input" placeholder="رابط خلفية الرئيسية" class="mb-1">
            <input type="text" id="bg-cars-input" placeholder="رابط خلفية السيارات" class="mb-1">
            <input type="text" id="bg-real-input" placeholder="رابط خلفية العقارات" class="mb-1">
            <input type="text" id="bg-shops-input" placeholder="رابط خلفية المتاجر" class="mb-1">
            <button onclick="updateBgs()" class="w-full btn-gold py-2 text-xs mt-2">تحديث الصور</button>
        </div>
    </div>

    <div id="cart-sidebar">
        <div class="flex justify-between items-center mb-6 border-b border-gold pb-2">
            <button onclick="toggleCart()" class="text-red-500 hover:text-red-400 transition"><i class="fas fa-times-circle fa-lg"></i></button>
            <h2 class="text-xl gold-gradient-text font-bold text-right">🛒 سلتك</h2>
        </div>
        
        <div id="cart-items-list" class="space-y-3 overflow-y-auto flex-1 mb-4"></div>
        
        <div class="bg-zinc-900/50 p-4 rounded-xl border border-zinc-800 mb-4">
            <p class="text-[11px] text-gold mb-2 font-bold">كود الخصم</p>
            <div class="flex gap-2">
                <input type="text" id="coupon-input" placeholder="ادخل الكود..." class="flex-1 !bg-black">
                <button onclick="applyCoupon()" class="bg-gold text-black px-4 rounded-lg text-xs font-bold">تفعيل</button>
            </div>
            <p id="coupon-msg" class="text-[10px] mt-2 text-center"></p>
        </div>

        <div class="w-full p-6 bg-black border-t border-gold">
            <div class="flex justify-between mb-4">
                <span class="text-sm text-gray-400">الإجمالي النهائي:</span>
                <span id="cart-total" class="gold-gradient-text font-bold text-lg">0.00 SR</span>
            </div>
            <button onclick="openCheckout()" class="w-full btn-gold py-3 rounded">تأكيد الطلب ✅</button>
        </div>
    </div>

    <nav class="flex justify-between items-center p-6 sticky top-0 z-40">
        <div class="flex flex-col">
            <span class="text-2xl font-black gold-gradient-text">ALAMARIYAH STORE</span>
            <div class="flex gap-1 mt-1">
                <button onclick="setCurrency('SAR')" class="currency-btn active" id="curr-SAR">SR</button>
                <button onclick="setCurrency('USD')" class="currency-btn" id="curr-USD">$</button>
                <button onclick="setCurrency('EUR')" class="currency-btn" id="curr-EUR">€</button>
                <button onclick="setCurrency('KWD')" class="currency-btn" id="curr-KWD">KWD</button>
                <button onclick="setCurrency('AED')" class="currency-btn" id="curr-AED">AED</button>
            </div>
        </div>
        <div class="hidden md:flex gap-8 text-sm font-bold">
            <button onclick="showSection('main')" class="nav-link" id="nav-main">الرئيسية</button>
            <button onclick="showSection('cars')" class="nav-link" id="nav-cars">السيارات</button>
            <button onclick="showSection('real')" class="nav-link" id="nav-real">العقارات</button>
            <button onclick="showSection('shops')" class="nav-link" id="nav-shops">المتاجر</button>
        </div>
        <button onclick="toggleCart()" class="gold-border px-5 py-2 rounded-full text-sm bg-black/60">
            🛒 السلة (<span id="cart-count">0</span>)
        </button>
    </nav>

    <div id="sec-main" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="main-list"></div></div>
    <div id="sec-cars" class="content-section p-10">
        <div class="max-w-6xl mx-auto">
            <select id="car-filter" onchange="renderProducts()" class="w-full md:w-64 bg-zinc-900 border-gold mb-10"></select>
            <div id="cars-container"></div>
        </div>
    </div>
    <div id="sec-real" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="real-list"></div></div>
    <div id="sec-shops" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="shops-list"></div></div>

    <div id="checkout-panel" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center z-[5000]">
        <div class="admin-modal p-8 max-w-sm w-full text-center border-2 border-gold">
            <h2 class="text-2xl gold-gradient-text font-black mb-4">تأكيد البيانات</h2>
            
            <div class="mb-4 p-3 bg-zinc-900 rounded-lg border border-zinc-800">
                <p class="text-xs text-gray-400 mb-1">المبلغ المطلوب تحويله:</p>
                <p id="checkout-total-display" class="text-xl font-bold text-white"></p>
                <p class="text-red-600 text-[11px] font-black mt-2">يرجى التحويل قبل فتح تذكرة</p>
            </div>

            <input type="text" id="discord-id" placeholder="ايدي ديسكوردك" class="mb-4 text-center">
            <div class="bg-white p-2 mb-4 inline-block rounded-lg"><img id="pay-qr" src="" class="w-32 h-32"></div>
            <button id="btn-open-ticket" onclick="handleOpenTicket()" class="w-full btn-gold py-3">فتح تذكرة ديسكورد</button>
            <button onclick="document.getElementById('checkout-panel').classList.add('hidden')" class="mt-4 text-gray-500 text-xs">إلغاء</button>
        </div>
    </div>

    <script>
        const BOT_URL = 'https://ar-store-i6tw.onrender.com';
        let adminPass = "1234";
        let cart = [];
        let productsDatabase = JSON.parse(localStorage.getItem('alamariyah_products')) || [];
        let companies = JSON.parse(localStorage.getItem('alamariyah_companies')) || ["فورد", "نيسان", "تويوتا"];
        let activeDiscounts = JSON.parse(localStorage.getItem('alamariyah_discounts')) || [];
        let manualCoupon = null;

        let currentCurrency = "SAR";
        const rates = { "SAR": 1, "USD": 0.27, "EUR": 0.25, "KWD": 0.083, "AED": 0.98 };
        
        function setCurrency(curr) {
            currentCurrency = curr;
            document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`curr-${curr}`).classList.add('active');
            renderProducts();
            updateCartUI();
        }

        function formatPrice(price) {
            let converted = price * rates[currentCurrency];
            return converted.toFixed(2) + " " + currentCurrency;
        }

        function showNotification(msg) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'toast-notify'; toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function accessAdmin() { if(prompt("كلمة سر الإدارة:") === adminPass) document.getElementById('admin-panel').style.transform = 'translateX(0)'; }
        function closeAdmin() { document.getElementById('admin-panel').style.transform = 'translateX(-100%)'; }
        
        function addCompany() {
            const name = document.getElementById('new-company-name').value;
            if(!name) return;
            companies.push(name);
            localStorage.setItem('alamariyah_companies', JSON.stringify(companies));
            document.getElementById('new-company-name').value = '';
            refreshCompanySelects();
            showNotification("تمت إضافة الشركة");
        }

        function deleteCompany() {
            const name = document.getElementById('delete-company-select').value;
            if(!name) return;
            companies = companies.filter(c => c !== name);
            localStorage.setItem('alamariyah_companies', JSON.stringify(companies));
            refreshCompanySelects();
            renderProducts();
            showNotification("تم حذف الشركة");
        }

        function refreshCompanySelects() {
            const selects = ['new-p-company-select', 'delete-company-select'];
            selects.forEach(id => {
                document.getElementById(id).innerHTML = companies.map(c => `<option value="${c}">${c}</option>`).join('');
            });
            document.getElementById('car-filter').innerHTML = `<option value="all">كل الشركات</option>` + companies.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function toggleCart() {
            const s = document.getElementById('cart-sidebar');
            s.style.transform = s.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
        }

        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('.discount-timer').forEach(el => {
                const expiry = parseInt(el.dataset.expiry);
                const diff = expiry - now;
                if (diff <= 0) { el.innerHTML = "انتهى العرض"; return; }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                el.innerHTML = `⏳ ينتهي خلال: ${h}س ${m}د ${s}ث`;
            });
        }, 1000);

        function getProductPrice(p) {
            let discount = 0; let expiry = 0;
            const now = Date.now();
            activeDiscounts.forEach(d => {
                if(now < d.expiry) {
                    let match = (d.type === 'all') || (d.type === 'cat' && p.cat === d.target) || (d.type === 'prod' && String(p.id) === String(d.target));
                    if(match && d.percent > discount) { discount = d.percent; expiry = d.expiry; }
                }
            });
            return { finalPrice: p.price - (p.price * (discount / 100)), discount, expiry };
        }

        function productCard(p) {
            const { finalPrice, discount, expiry } = getProductPrice(p);
            const imgHtml = p.img ? `<img src="${p.img}" class="product-img">` : `<div class="product-img bg-zinc-800"></div>`;
            return `
            <div class="bg-zinc-900/90 p-5 rounded-2xl border border-zinc-800 text-center relative overflow-hidden">
                <span class="absolute top-2 left-2 bg-black/60 text-gold text-[9px] px-2 py-1 rounded-full z-10">📦 ${p.stock}</span>
                ${discount > 0 ? `<span class="absolute top-2 right-2 discount-badge z-10">-${discount}%</span>` : ''}
                ${imgHtml}
                <h4 class="text-md font-bold mb-1">${p.name}</h4>
                <div class="gold-gradient-text font-black text-lg">
                    ${discount > 0 ? `<span class="old-price">${formatPrice(p.price)}</span>` : ''} ${formatPrice(finalPrice)}
                </div>
                ${discount > 0 ? `<div class="timer-box discount-timer" data-expiry="${expiry}"></div>` : ''}
                <button onclick="addToCart(${p.id})" class="w-full btn-gold py-2 text-xs rounded-lg mt-4">إضافة للسلة</button>
            </div>`;
        }

        function renderProducts() {
            ['main', 'real', 'shops'].forEach(c => {
                const el = document.getElementById(`${c}-list`);
                if(el) el.innerHTML = '';
            });
            const carsContainer = document.getElementById('cars-container');
            const carFilter = document.getElementById('car-filter').value;
            carsContainer.innerHTML = '';
            companies.forEach(comp => {
                if (carFilter !== 'all' && carFilter !== comp) return;
                const compProducts = productsDatabase.filter(p => p.cat === 'cars' && p.company === comp);
                if(compProducts.length > 0) {
                    let html = `<div class="mb-10"><h3 class="text-gold font-black mb-4 pr-2 border-r-4 border-gold">${comp}</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                    compProducts.forEach(p => html += productCard(p));
                    carsContainer.innerHTML += html + `</div></div>`;
                }
            });
            productsDatabase.forEach(p => { if(p.cat !== 'cars') { const el = document.getElementById(`${p.cat}-list`); if(el) el.innerHTML += productCard(p); } });
        }

        function addToCart(id) {
            const p = productsDatabase.find(x => x.id === id);
            const existing = cart.find(x => x.id === id);
            if (existing) {
                if (existing.qty < p.stock) {
                    existing.qty++; updateCartUI(); showNotification("تمت زيادة الكمية");
                } else showNotification("عفواً، لا توجد نسخ إضافية بالمخزون");
            } else {
                if (p.stock > 0) {
                    const { finalPrice } = getProductPrice(p);
                    cart.push({...p, finalPrice, qty: 1}); updateCartUI(); showNotification("تمت الإضافة للسلة");
                } else showNotification("المنتج نافذ من المخزون");
            }
        }

        function changeQty(id, delta) {
            const p = productsDatabase.find(x => x.id === id);
            const item = cart.find(x => x.id === id);
            if (item) {
                const newQty = item.qty + delta;
                if (newQty > 0 && newQty <= p.stock) item.qty = newQty;
                else if (newQty === 0) cart = cart.filter(x => x.id !== id);
                updateCartUI();
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.map((item) => `
                <div class="bg-zinc-900/80 p-3 rounded-lg border-r-2 border-gold flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold">${item.name}</span>
                        <span class="gold-gradient-text text-xs">${formatPrice(item.finalPrice * item.qty)}</span>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty(${item.id}, -1)" class="qty-btn text-red-500">-</button>
                            <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="qty-btn text-green-500">+</button>
                        </div>
                        <button onclick="cart = cart.filter(x => x.id !== ${item.id}); updateCartUI()" class="text-gray-500 text-[10px] hover:text-red-500">إزالة</button>
                    </div>
                </div>
            `).join('');
            
            let total = cart.reduce((sum, item) => sum + (item.finalPrice * item.qty), 0);
            if(manualCoupon) total = total - (total * (manualCoupon.percent / 100));
            document.getElementById('cart-total').innerText = formatPrice(total);
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
        }

        function applyCoupon() {
            const code = document.getElementById('coupon-input').value;
            const now = Date.now();
            const disc = activeDiscounts.find(d => d.type === 'coupon' && d.code === code && now < d.expiry);
            if(disc) {
                manualCoupon = disc;
                document.getElementById('coupon-msg').innerText = `تم تفعيل خصم ${disc.percent}% ✅`;
                document.getElementById('coupon-msg').className = "text-green-500 text-[10px] mt-2 text-center font-bold";
                updateCartUI();
            } else {
                document.getElementById('coupon-msg').innerText = "الكود خاطئ ❌";
                document.getElementById('coupon-msg').className = "text-red-500 text-[10px] mt-2 text-center";
            }
        }

        function addProduct() {
            const name = document.getElementById('new-p-name').value;
            const price = parseFloat(document.getElementById('new-p-price').value);
            const stock = parseInt(document.getElementById('new-p-stock').value);
            const cat = document.getElementById('new-p-cat').value;
            const img = document.getElementById('new-p-img').value;
            if(!name || !price) return alert("املا البيانات");
            productsDatabase.push({ id: Date.now(), name, price, stock, cat, img, company: (cat === 'cars' ? document.getElementById('new-p-company-select').value : 'عام') });
            localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
            renderProducts(); showNotification("تمت الإضافة!");
        }

        function loadProductsToEdit() {
            const cat = document.getElementById('edit-cat-select').value;
            const select = document.getElementById('edit-prod-select');
            if(!cat) { select.classList.add('hidden'); return; }
            const filtered = productsDatabase.filter(p => p.cat === cat);
            select.innerHTML = '<option value="">اختر المنتج</option>' + filtered.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            select.classList.remove('hidden');
        }

        function fillEditData() {
            const id = document.getElementById('edit-prod-select').value;
            if(!id) return;
            const p = productsDatabase.find(x => String(x.id) === String(id));
            document.getElementById('edit-p-name').value = p.name;
            document.getElementById('edit-p-price').value = p.price;
            document.getElementById('edit-p-stock').value = p.stock;
            document.getElementById('edit-p-img').value = p.img || '';
            document.getElementById('edit-fields').classList.remove('hidden');
        }

        function saveProductEdits() {
            const id = document.getElementById('edit-prod-select').value;
            const p = productsDatabase.find(x => String(x.id) === String(id));
            p.name = document.getElementById('edit-p-name').value;
            p.price = parseFloat(document.getElementById('edit-p-price').value);
            p.stock = parseInt(document.getElementById('edit-p-stock').value);
            p.img = document.getElementById('edit-p-img').value;
            localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
            renderProducts(); showNotification("تم التحديث!");
        }

        function deleteProduct() {
            const id = document.getElementById('edit-prod-select').value;
            productsDatabase = productsDatabase.filter(x => String(x.id) !== String(id));
            localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
            renderProducts(); loadProductsToEdit();
        }

        function setDiscount() {
            const type = document.getElementById('disc-type').value;
            const percent = parseFloat(document.getElementById('disc-percent').value);
            const hours = parseFloat(document.getElementById('disc-hours').value);
            activeDiscounts.push({ type, target: type === 'cat' ? document.getElementById('disc-cat-val').value : (type === 'prod' ? document.getElementById('disc-prod-val').value : null), percent, expiry: Date.now() + (hours * 3600000), code: type === 'coupon' ? document.getElementById('disc-coupon-code').value : null });
            localStorage.setItem('alamariyah_discounts', JSON.stringify(activeDiscounts));
            renderProducts(); showNotification("تم تفعيل العرض!");
        }

        function toggleDiscOptions() {
            const type = document.getElementById('disc-type').value;
            document.getElementById('disc-cat-div').classList.toggle('hidden', type !== 'cat');
            document.getElementById('disc-prod-div').classList.toggle('hidden', type !== 'prod');
            document.getElementById('disc-coupon-div').classList.toggle('hidden', type !== 'coupon');
            if(type === 'prod') document.getElementById('disc-prod-val').innerHTML = productsDatabase.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }

        function updateBgs() {
            const bgs = { main: document.getElementById('bg-main-input').value, cars: document.getElementById('bg-cars-input').value, real: document.getElementById('bg-real-input').value, shops: document.getElementById('bg-shops-input').value };
            localStorage.setItem('alamariyah_bgs', JSON.stringify(bgs));
            applyBgs(); showNotification("تم تحديث الخلفيات");
        }

        function applyBgs() {
            const saved = JSON.parse(localStorage.getItem('alamariyah_bgs'));
            if(saved) {
                if(saved.main) document.getElementById('bg-main').style.backgroundImage = `url('${saved.main}')`;
                if(saved.cars) document.getElementById('bg-cars').style.backgroundImage = `url('${saved.cars}')`;
                if(saved.real) document.getElementById('bg-real').style.backgroundImage = `url('${saved.real}')`;
                if(saved.shops) document.getElementById('bg-shops').style.backgroundImage = `url('${saved.shops}')`;
            }
        }

        function openCheckout() {
            if(cart.length === 0) return alert("السلة فارغة");
            const finalTotal = document.getElementById('cart-total').innerText;
            document.getElementById('checkout-total-display').innerText = finalTotal;
            document.getElementById('pay-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${finalTotal}`;
            document.getElementById('checkout-panel').classList.remove('hidden');
        }

        async function handleOpenTicket() {
            const dId = document.getElementById('discord-id').value;
            if(!dId) return alert("ايدي ديسكوردك مطلوب!");
            const btn = document.getElementById('btn-open-ticket');
            btn.innerText = "⏳ جاري الإرسال..."; btn.disabled = true;
            try {
                const res = await fetch(`${BOT_URL}/api/create-ticket`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ discordId: dId, orderDetails: cart.map(i => `${i.name} (${i.qty})`).join(' + '), totalPrice: document.getElementById('cart-total').innerText })
                });
                if(res.ok) { alert("✅ تم فتح تذكرة بنجاح!"); cart=[]; updateCartUI(); location.reload(); }
                else alert("❌ فشل الاتصال بالبوت.");
            } catch(e) { alert("❌ خطأ في الخادم."); }
            finally { btn.disabled = false; btn.innerText = "فتح تذكرة ديسكورد"; }
        }

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.section-bg').forEach(bg => bg.classList.remove('active-bg'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            const bgEl = document.getElementById(`bg-${id}`);
            const secEl = document.getElementById(`sec-${id}`);
            const navEl = document.getElementById(`nav-${id}`);

            if(bgEl) bgEl.classList.add('active-bg');
            if(secEl) secEl.style.display = 'block';
            if(navEl) navEl.classList.add('active');
        }

        function toggleAdminCompanySelect() { document.getElementById('admin-company-div').classList.toggle('hidden', document.getElementById('new-p-cat').value !== 'cars'); }

        window.onload = () => {
            refreshCompanySelects();
            renderProducts(); applyBgs(); showSection('main');
        };
    </script>
</body>
</html>
