<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alamariyah RP - العمارية أر بي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.4); }
        body { background-color: #050505; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; margin: 0; }
        .gold-gradient-text { background: linear-gradient(to bottom, #f9d976, #d4af37); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border { border: 1px solid var(--gold); }
        nav { background: rgba(0, 0, 0, 0.4) !important; backdrop-filter: blur(15px); border: 2px solid var(--gold) !important; margin: 15px 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .nav-link { font-size: 1.1rem; transition: 0.3s; position: relative; cursor: pointer; }
        .nav-link.active { color: var(--gold); font-weight: 900; text-shadow: 0 0 10px var(--gold-glow); }
        .admin-trigger { position: fixed; bottom: 10px; right: 10px; z-index: 9999; opacity: 0; transition: 0.5s; cursor: pointer; padding: 10px; }
        .admin-trigger:hover { opacity: 0.5; transform: rotate(90deg); color: var(--gold); }
        .section-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-size: cover; background-position: center; z-index: -1; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .active-bg { opacity: 1; }
        .content-section { display: none; padding-top: 20px; min-height: 100vh; }
        .admin-modal { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--gold); border-radius: 15px; z-index: 6000; transition: 0.4s; }
        .btn-gold { background: linear-gradient(45deg, #aa8418, #d4af37); color: black; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .btn-gold:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 15px var(--gold-glow); }
        .btn-gold:disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }
        
        /* تعديل القوائم والمدخلات لضمان الخلفية الداكنة */
        input, select { 
            background: #111 !important; 
            border: 1px solid rgba(212, 175, 55, 0.3) !important; 
            color: white !important; 
            padding: 8px; 
            border-radius: 8px; 
            width: 100%; 
            font-size: 12px; 
            outline: none;
        }
        select option { background: #111; color: white; }

        #cart-sidebar { position: fixed; left: 0; top: 0; width: 320px; height: 100%; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(25px); border-right: 2px solid var(--gold); transform: translateX(-100%); transition: 0.3s; z-index: 2000; padding: 20px; display: flex; flex-direction: column; }
        #notification-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast-notify { background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--gold); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; animation: slideIn 0.4s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .qty-btn { background: rgba(255,255,255,0.1); border: 1px solid #444; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-weight: bold; }
        .currency-btn { background: #111; border: 1px solid #333; padding: 4px 8px; border-radius: 5px; font-size: 10px; }
        .currency-btn.active { border-color: var(--gold); color: var(--gold); }
        .glass-card { background: rgba(255, 255, 255, 0.03) !important; backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .discount-badge { background: #ff3e3e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8em; }
        .timer-box { font-size: 10px; background: rgba(255, 62, 62, 0.2); color: #ff3e3e; padding: 2px 6px; border-radius: 4px; border: 1px solid #ff3e3e; margin-top: 5px; display: inline-block; }
        .company-divider { height: 2px; background: linear-gradient(90deg, transparent, #d4af37, #000, #d4af37, transparent); margin: 15px 0 25px 0; border: none; }
        .company-header { display: flex; align-items: center; gap: 15px; margin-top: 40px; }
        .company-logo-img { width: 50px; height: 50px; object-fit: contain; }
    </style>
</head>
<body>

    <div id="notification-container"></div>
    <div class="admin-trigger" onclick="accessAdmin()"><i class="fas fa-cog fa-2x"></i></div>

    <div id="bg-main" class="section-bg active-bg"></div>
    <div id="bg-cars" class="section-bg"></div>
    <div id="bg-real" class="section-bg"></div>
    <div id="bg-shops" class="section-bg"></div>

    <div id="admin-panel" class="fixed left-0 top-0 h-full w-full md:w-[450px] admin-modal translate-x-[-100%] overflow-y-auto p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-gold pb-2">
            <h2 class="text-xl gold-gradient-text font-black">⚙️ لوحة التحكم الشاملة</h2>
            <button onclick="closeAdmin()" class="text-red-500 text-2xl">&times;</button>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg border border-blue-500/30 backdrop-blur-md">
            <h3 class="text-blue-400 text-sm mb-3 font-bold"><i class="fas fa-history"></i> آخر الطلبات</h3>
            <div id="admin-orders-list" class="space-y-2 max-h-40 overflow-y-auto text-[10px]"></div>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg border border-red-500/30 backdrop-blur-md">
            <h3 class="text-red-400 text-sm mb-3 font-bold"><i class="fas fa-tag"></i> إدارة الخصومات</h3>
            <div class="space-y-2">
                <select id="disc-type" onchange="toggleDiscTarget()">
                    <option value="all">كل المتجر</option>
                    <option value="cat">فئة كاملة</option>
                    <option value="prod">منتج معين</option>
                </select>
                <div id="disc-target-container" class="hidden">
                    <select id="disc-target"></select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="disc-percent" placeholder="نسبة الخصم %">
                    <input type="number" id="disc-hours" placeholder="المدة (ساعة)">
                </div>
                <button onclick="applyNewDiscount()" class="w-full bg-red-700 py-1 rounded text-[10px]">تفعيل الخصم الآن</button>
            </div>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg border border-purple-500/30 backdrop-blur-md">
            <h3 class="text-purple-400 text-sm mb-3 font-bold"><i class="fas fa-image"></i> تعديل خلفيات الأقسام</h3>
            <div class="space-y-2">
                <select id="bg-edit-select">
                    <option value="main">الرئيسية</option>
                    <option value="cars">السيارات</option>
                    <option value="real">العقارات</option>
                    <option value="shops">المتاجر</option>
                </select>
                <input type="text" id="bg-edit-url" placeholder="رابط الخلفية الجديد">
                <button onclick="updateSectionBg()" class="w-full bg-purple-700 py-1 rounded text-[10px]">تحديث الخلفية</button>
            </div>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg border border-yellow-500/30 backdrop-blur-md">
            <h3 class="text-yellow-400 text-sm mb-3 font-bold"><i class="fas fa-edit"></i> تعديل / حذف منتج</h3>
            <select id="edit-prod-select" onchange="loadProductToEdit()" class="mb-2">
                <option value="">اختر منتجاً للتعديل...</option>
            </select>
            <div id="edit-form" class="hidden space-y-2">
                <input type="text" id="edit-p-name" placeholder="الاسم">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="edit-p-price" placeholder="السعر">
                    <input type="number" id="edit-p-stock" placeholder="المخزون">
                </div>
                <input type="text" id="edit-p-img" placeholder="رابط الصورة">
                <div class="flex gap-2">
                    <button onclick="saveProductEdit()" class="flex-1 bg-green-700 py-1 rounded text-[10px]">حفظ التعديل</button>
                    <button onclick="deleteProduct()" class="flex-1 bg-red-700 py-1 rounded text-[10px]">حذف المنتج</button>
                </div>
            </div>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg border border-gold/20 backdrop-blur-md">
            <h3 class="text-gold text-sm mb-3 font-bold">🏢 إدارة الشركات</h3>
            <div class="space-y-2 mb-4">
                <input type="text" id="new-company-name" placeholder="اسم الشركة">
                <input type="text" id="new-company-logo" placeholder="رابط الشعار">
                <button onclick="addCompany()" class="w-full bg-green-700 py-2 rounded text-xs">إضافة الشركة</button>
            </div>
            <select id="delete-company-select" class="mb-2"></select>
            <button onclick="deleteCompany()" class="w-full bg-red-900/50 text-red-500 py-1 rounded text-[10px]">حذف الشركة</button>
        </div>

        <div class="mb-6 p-4 bg-zinc-900/50 rounded-lg backdrop-blur-md">
            <h3 class="text-gold text-sm mb-3 font-bold">📦 إضافة منتج جديد</h3>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="new-p-name" placeholder="الاسم">
                <input type="number" id="new-p-price" placeholder="السعر">
                <input type="number" id="new-p-stock" placeholder="المخزون">
                <input type="text" id="new-p-img" placeholder="رابط الصورة">
                <select id="new-p-cat" onchange="toggleAdminCompanySelect()" class="col-span-2">
                    <option value="main">الرئيسية</option>
                    <option value="cars">السيارات</option>
                    <option value="real">العقارات</option>
                    <option value="shops">المتاجر</option>
                </select>
                <div id="admin-company-div" class="hidden col-span-2">
                    <select id="new-p-company-select"></select>
                </div>
            </div>
            <button onclick="addProduct()" class="w-full btn-gold py-2 text-xs mt-3">حفظ المنتج ✅</button>
        </div>
    </div>

    <div id="cart-sidebar">
        <div class="flex justify-between items-center mb-6 border-b border-gold pb-2">
            <button onclick="toggleCart()" class="text-red-500"><i class="fas fa-times-circle fa-lg"></i></button>
            <h2 class="text-xl gold-gradient-text font-bold">🛒 سلتك</h2>
        </div>
        <div id="cart-items-list" class="space-y-3 overflow-y-auto flex-1 mb-4"></div>
        <div class="w-full p-6 bg-black/50 border-t border-gold backdrop-blur-md">
            <div class="flex justify-between mb-4">
                <span class="text-sm text-gray-400">الإجمالي:</span>
                <span id="cart-total" class="gold-gradient-text font-bold text-lg">0.00 SR</span>
            </div>
            <button onclick="openCheckout()" class="w-full btn-gold py-3 rounded">تأكيد الطلب ✅</button>
        </div>
    </div>

    <nav class="flex justify-between items-center p-6 sticky top-0 z-40">
        <div class="flex flex-col">
            <span class="text-2xl font-black gold-gradient-text">ALAMARIYAH STORE</span>
            <div class="flex gap-1 mt-1">
                <button onclick="setCurrency('SAR')" class="currency-btn active" id="curr-SAR">SR</button>
                <button onclick="setCurrency('USD')" class="currency-btn" id="curr-USD">$</button>
            </div>
        </div>
        <div class="hidden md:flex gap-8 text-sm font-bold">
            <button onclick="showSection('main')" class="nav-link" id="nav-main">الرئيسية</button>
            <button onclick="showSection('cars')" class="nav-link" id="nav-cars">السيارات</button>
            <button onclick="showSection('real')" class="nav-link" id="nav-real">العقارات</button>
            <button onclick="showSection('shops')" class="nav-link" id="nav-shops">المتاجر</button>
        </div>
        <button onclick="toggleCart()" class="gold-border px-5 py-2 rounded-full text-sm bg-black/60 backdrop-blur-md">
            🛒 (<span id="cart-count">0</span>)
        </button>
    </nav>

    <div id="sec-main" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="main-list"></div></div>
    <div id="sec-cars" class="content-section p-10">
        <div class="max-w-6xl mx-auto">
            <select id="car-filter" onchange="renderProducts()" class="w-full md:w-64 mb-10"></select>
            <div id="cars-container"></div>
        </div>
    </div>
    <div id="sec-real" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="real-list"></div></div>
    <div id="sec-shops" class="content-section p-10"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl mx-auto" id="shops-list"></div></div>

    <div id="checkout-panel" class="fixed inset-0 bg-black/95 hidden flex items-center justify-center z-[5000]">
        <div class="admin-modal p-8 max-w-sm w-full text-center border-2 border-gold">
            <h2 class="text-2xl gold-gradient-text font-black mb-4">تأكيد البيانات</h2>
            <p id="checkout-total-display" class="text-xl font-bold mb-4"></p>
            <input type="text" id="discord-id" placeholder="ايدي ديسكوردك" class="mb-4 text-center">
            <button id="btn-open-ticket" onclick="handleOpenTicket()" class="w-full btn-gold py-3">فتح تذكرة وتثبيت الطلب</button>
            <button onclick="document.getElementById('checkout-panel').classList.add('hidden')" class="mt-4 text-gray-500 text-xs">إلغاء</button>
        </div>
    </div>

    <script>
        const BOT_URL = 'https://ar-store-i6tw.onrender.com';
        let adminPass = "1234";
        let cart = [];
        let productsDatabase = JSON.parse(localStorage.getItem('alamariyah_products')) || [];
        let companies = JSON.parse(localStorage.getItem('alamariyah_companies_v2')) || [
            {name: "فورد", logo: ""}, {name: "نيسان", logo: ""}, {name: "تويوتا", logo: ""}
        ];
        let activeDiscounts = JSON.parse(localStorage.getItem('alamariyah_discounts')) || [];
        let orderHistory = JSON.parse(localStorage.getItem('alamariyah_orders')) || [];
        let sectionBgs = JSON.parse(localStorage.getItem('alamariyah_bgs')) || { main: '', cars: '', real: '', shops: '' };
        let currentCurrency = "SAR";
        const rates = { "SAR": 1, "USD": 0.27 };

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.section-bg').forEach(bg => bg.classList.remove('active-bg'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('sec-' + id).style.display = 'block';
            document.getElementById('bg-' + id).classList.add('active-bg');
            document.getElementById('nav-' + id).classList.add('active');
        }

        function formatPrice(p) { return (p * rates[currentCurrency]).toFixed(2) + " " + currentCurrency; }

        function showNotification(msg) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'toast-notify'; toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function accessAdmin() { if(prompt("كلمة المرور:") === adminPass) { document.getElementById('admin-panel').style.transform = 'translateX(0)'; updateAdminLists(); } }
        function closeAdmin() { document.getElementById('admin-panel').style.transform = 'translateX(-100%)'; }

        function applyBackgrounds() {
            Object.keys(sectionBgs).forEach(id => {
                const el = document.getElementById('bg-' + id);
                if(el && sectionBgs[id]) el.style.backgroundImage = `url('${sectionBgs[id]}')`;
            });
        }
        
        function updateSectionBg() {
            const sec = document.getElementById('bg-edit-select').value;
            const url = document.getElementById('bg-edit-url').value;
            if(url) {
                sectionBgs[sec] = url;
                localStorage.setItem('alamariyah_bgs', JSON.stringify(sectionBgs));
                applyBackgrounds();
                showNotification("تم تحديث الخلفية");
            }
        }

        function updateAdminLists() {
            const editSelect = document.getElementById('edit-prod-select');
            editSelect.innerHTML = '<option value="">اختر منتجاً للتعديل...</option>' + 
                productsDatabase.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const orderList = document.getElementById('admin-orders-list');
            orderList.innerHTML = orderHistory.length ? orderHistory.map(o => `
                <div class="p-2 bg-black/40 rounded border border-white/10 mb-1">
                    <p>ID: ${o.discordId} | ${o.price}</p>
                    <p class="text-gray-400">${o.items}</p>
                </div>
            `).reverse().join('') : "لا يوجد طلبات حالياً";
        }

        function loadProductToEdit() {
            const id = document.getElementById('edit-prod-select').value;
            const p = productsDatabase.find(x => x.id == id);
            const form = document.getElementById('edit-form');
            if(p) {
                form.classList.remove('hidden');
                document.getElementById('edit-p-name').value = p.name;
                document.getElementById('edit-p-price').value = p.price;
                document.getElementById('edit-p-stock').value = p.stock;
                document.getElementById('edit-p-img').value = p.img;
            } else form.classList.add('hidden');
        }

        function saveProductEdit() {
            const id = document.getElementById('edit-prod-select').value;
            const idx = productsDatabase.findIndex(x => x.id == id);
            if(idx > -1) {
                productsDatabase[idx].name = document.getElementById('edit-p-name').value;
                productsDatabase[idx].price = parseFloat(document.getElementById('edit-p-price').value);
                productsDatabase[idx].stock = parseInt(document.getElementById('edit-p-stock').value);
                productsDatabase[idx].img = document.getElementById('edit-p-img').value;
                localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
                renderProducts(); updateAdminLists();
                showNotification("تم التعديل بنجاح");
            }
        }

        function deleteProduct() {
            const id = document.getElementById('edit-prod-select').value;
            if(confirm("حذف المنتج؟")) {
                productsDatabase = productsDatabase.filter(x => x.id != id);
                localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
                renderProducts(); updateAdminLists();
                document.getElementById('edit-form').classList.add('hidden');
            }
        }

        function addProduct() {
            const p = {
                id: Date.now(),
                name: document.getElementById('new-p-name').value,
                price: parseFloat(document.getElementById('new-p-price').value),
                stock: parseInt(document.getElementById('new-p-stock').value),
                cat: document.getElementById('new-p-cat').value,
                img: document.getElementById('new-p-img').value,
                company: document.getElementById('new-p-cat').value === 'cars' ? document.getElementById('new-p-company-select').value : 'عام'
            };
            if(p.name && p.price) { productsDatabase.push(p); localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase)); renderProducts(); updateAdminLists(); showNotification("تمت الإضافة"); }
        }

        function addCompany() {
            const n = document.getElementById('new-company-name').value;
            const l = document.getElementById('new-company-logo').value;
            if(n) { companies.push({name: n, logo: l}); localStorage.setItem('alamariyah_companies_v2', JSON.stringify(companies)); refreshCompanySelects(); showNotification("تمت إضافة الشركة"); }
        }

        function deleteCompany() {
            const name = document.getElementById('delete-company-select').value;
            if(confirm(`حذف ${name}؟`)) { companies = companies.filter(c => c.name !== name); localStorage.setItem('alamariyah_companies_v2', JSON.stringify(companies)); refreshCompanySelects(); renderProducts(); }
        }

        function toggleAdminCompanySelect() {
            document.getElementById('admin-company-div').classList.toggle('hidden', document.getElementById('new-p-cat').value !== 'cars');
        }

        // --- استعادة وظائف الخصم ---
        function toggleDiscTarget() {
            const type = document.getElementById('disc-type').value;
            const container = document.getElementById('disc-target-container');
            const targetSelect = document.getElementById('disc-target');
            if(type === 'all') container.classList.add('hidden');
            else {
                container.classList.remove('hidden');
                if(type === 'cat') {
                    targetSelect.innerHTML = `<option value="main">الرئيسية</option><option value="cars">السيارات</option><option value="real">العقارات</option><option value="shops">المتاجر</option>`;
                } else {
                    targetSelect.innerHTML = productsDatabase.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
                }
            }
        }

        function applyNewDiscount() {
            const percent = parseInt(document.getElementById('disc-percent').value);
            const hours = parseInt(document.getElementById('disc-hours').value);
            if(!percent || !hours) return alert("املا البيانات");
            const disc = {
                type: document.getElementById('disc-type').value,
                target: document.getElementById('disc-target').value,
                percent: percent,
                expiry: Date.now() + (hours * 3600 * 1000)
            };
            activeDiscounts.push(disc);
            localStorage.setItem('alamariyah_discounts', JSON.stringify(activeDiscounts));
            renderProducts();
            showNotification("تم تفعيل الخصم!");
        }

        function getProductPrice(p) {
            let discount = 0, expiry = 0, now = Date.now();
            activeDiscounts.forEach(d => {
                if(now < d.expiry) {
                    let match = (d.type === 'all') || (d.type === 'cat' && p.cat === d.target) || (d.type === 'prod' && String(p.id) === String(d.target));
                    if(match && d.percent > discount) { discount = d.percent; expiry = d.expiry; }
                }
            });
            return { finalPrice: p.price - (p.price * (discount / 100)), discount, expiry };
        }

        function addToCart(id) {
            const p = productsDatabase.find(x => x.id == id);
            if (!p) return;
            const { finalPrice } = getProductPrice(p);
            const existing = cart.find(x => x.id == id);
            if(existing) { 
                if(existing.qty < p.stock) existing.qty++; 
                else showNotification("لا يوجد مخزون كافي");
            } else { 
                if(p.stock > 0) cart.push({id: p.id, name: p.name, finalPrice: finalPrice, qty: 1}); 
                else showNotification("نفذت الكمية");
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = cart.map(item => `
                <div class="bg-white/5 backdrop-blur-md p-3 rounded-lg border-r-2 border-gold flex justify-between items-center">
                    <div><p class="text-[10px] font-bold text-white">${item.name}</p><p class="text-gold text-[9px]">${formatPrice(item.finalPrice)}</p></div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${item.id}, -1)" class="qty-btn">-</button>
                        <span class="text-xs text-white">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="qty-btn">+</button>
                    </div>
                </div>
            `).join('');
            let total = cart.reduce((sum, i) => sum + (i.finalPrice * i.qty), 0);
            document.getElementById('cart-total').innerText = formatPrice(total);
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
        }

        function changeQty(id, delta) {
            const item = cart.find(x => x.id == id);
            const p = productsDatabase.find(x => x.id == id);
            if(item && p) {
                const n = item.qty + delta;
                if(n > 0 && n <= p.stock) item.qty = n;
                else if(n === 0) cart = cart.filter(x => x.id != id);
                updateCartUI();
            }
        }

        async function handleOpenTicket() {
            const dId = document.getElementById('discord-id').value;
            if(!dId) return alert("يرجى إدخال ايدي الديسكورد");
            const btn = document.getElementById('btn-open-ticket');
            btn.disabled = true; btn.innerText = "جاري المعالجة...";
            const orderData = {
                discordId: dId,
                items: cart.map(i => `${i.name} (x${i.qty})`).join(', '),
                price: document.getElementById('cart-total').innerText,
                date: new Date().toLocaleString()
            };
            try {
                const response = await fetch(`${BOT_URL}/api/create-ticket`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(orderData)
                });
                if(response.ok) {
                    cart.forEach(cItem => { const p = productsDatabase.find(x => x.id == cItem.id); if(p) p.stock -= cItem.qty; });
                    orderHistory.push(orderData);
                    localStorage.setItem('alamariyah_products', JSON.stringify(productsDatabase));
                    localStorage.setItem('alamariyah_orders', JSON.stringify(orderHistory));
                    alert("✅ تم إرسال الطلب بنجاح!");
                    cart = []; updateCartUI(); renderProducts();
                    document.getElementById('checkout-panel').classList.add('hidden');
                } else alert("❌ خطأ في الاتصال بالبوت");
            } catch (e) { alert("❌ خطأ غير متوقع"); }
            btn.disabled = false; btn.innerText = "فتح تذكرة وتثبيت الطلب";
        }

        function updateTimers() {
            document.querySelectorAll('.discount-timer').forEach(el => {
                const expiry = parseInt(el.dataset.expiry);
                const diff = expiry - Date.now();
                if(diff <= 0) { el.parentElement.remove(); return; }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                el.innerText = `تنتهي خلال: ${h}س ${m}د ${s}ث`;
            });
        }
        setInterval(updateTimers, 1000);

        function productCard(p) {
            const { finalPrice, discount, expiry } = getProductPrice(p);
            const isOutOfStock = p.stock <= 0;
            return `
            <div class="glass-card p-5 rounded-2xl text-center relative ${isOutOfStock ? 'opacity-50' : ''}">
                <span class="absolute top-2 left-2 bg-black/60 text-gold text-[9px] px-2 py-1 rounded-full z-10">📦 ${p.stock}</span>
                ${discount > 0 ? `<span class="absolute top-2 right-2 discount-badge">-${discount}%</span>` : ''}
                <img src="${p.img || 'https://via.placeholder.com/150'}" class="product-img">
                <h4 class="text-sm font-bold mb-1 text-white">${p.name}</h4>
                <div class="gold-gradient-text font-black text-lg">
                    ${discount > 0 ? `<span class="old-price text-xs mr-2">${formatPrice(p.price)}</span>` : ''} ${formatPrice(finalPrice)}
                </div>
                ${discount > 0 ? `<div class="timer-box discount-timer" data-expiry="${expiry}"></div>` : ''}
                <button onclick="addToCart(${p.id})" class="w-full btn-gold py-2 text-xs rounded-lg mt-4" ${isOutOfStock ? 'disabled' : ''}>
                    ${isOutOfStock ? 'نفذت الكمية' : 'إضافة للسلة'}
                </button>
            </div>`;
        }

        function renderProducts() {
            ['main', 'real', 'shops'].forEach(cat => {
                const el = document.getElementById(`${cat}-list`);
                if(el) el.innerHTML = productsDatabase.filter(p => p.cat === cat).map(p => productCard(p)).join('');
            });
            const container = document.getElementById('cars-container');
            const filter = document.getElementById('car-filter').value;
            container.innerHTML = '';
            companies.forEach(comp => {
                if (filter !== 'all' && filter !== comp.name) return;
                const prods = productsDatabase.filter(p => p.cat === 'cars' && p.company === comp.name);
                if(prods.length > 0) {
                    container.innerHTML += `
                        <div class="company-section mb-12">
                            <div class="company-header">
                                ${comp.logo ? `<img src="${comp.logo}" class="company-logo-img">` : ''}
                                <h3 class="text-gold font-black text-xl">${comp.name}</h3>
                            </div>
                            <hr class="company-divider">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${prods.map(p => productCard(p)).join('')}</div>
                        </div>`;
                }
            });
        }

        function refreshCompanySelects() {
            const opts = companies.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            const adminPComp = document.getElementById('new-p-company-select');
            const adminDelComp = document.getElementById('delete-company-select');
            const filter = document.getElementById('car-filter');
            if(adminPComp) adminPComp.innerHTML = opts;
            if(adminDelComp) adminDelComp.innerHTML = opts;
            if(filter) filter.innerHTML = '<option value="all">كل الشركات</option>' + opts;
        }

        function setCurrency(c) { currentCurrency = c; document.querySelectorAll('.currency-btn').forEach(b => b.classList.toggle('active', b.id === 'curr-'+c)); renderProducts(); updateCartUI(); }
        function toggleCart() { const s = document.getElementById('cart-sidebar'); s.style.transform = s.style.transform === 'translateX(0%)' ? 'translateX(-100%)' : 'translateX(0%)'; }
        function openCheckout() { if(!cart.length) return; document.getElementById('checkout-total-display').innerText = "المبلغ: " + document.getElementById('cart-total').innerText; document.getElementById('checkout-panel').classList.remove('hidden'); }

        window.onload = () => { applyBackgrounds(); renderProducts(); refreshCompanySelects(); showSection('main'); };
    </script>
</body>
</html>
