<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --black: #0a0a0a; 
            --card-bg: #151515; 
            --nav-bg: #111; 
            --discount-red: #ff4d4d; 
        }

        /* --- المؤشر الذهبي المطور --- */
        * { cursor: none !important; }
        button, a, select, input { cursor: none !important; pointer-events: auto !important; }

        #custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp?ex=69536e3b&is=69521cbb&hm=1b0b626b03dc2254beb7ea42eb3975028f74e1b0f6a2c6dcde4efd80665e6e34&') no-repeat center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px #D4AF37) brightness(1.2);
            transition: transform 0.1s ease-out;
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 80px; overflow-x: hidden; }

        h2 {
            color: var(--gold);
            font-weight: 900;
            margin: 40px 0 25px 0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 25px;
            background: rgba(212, 175, 55, 0.05);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            float: right;
            clear: both;
        }

        .section-header { width: 100%; display: block; overflow: hidden; margin-bottom: 20px; padding: 0 20px; }

        nav { 
            position: fixed; top: 0; width: 100%; background: var(--nav-bg); 
            border-bottom: 2px solid var(--gold); display: flex; justify-content: center; 
            align-items: center; gap: 20px; padding: 15px 0; z-index: 9000;
        }

        nav a { color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 8px 15px; border-radius: 5px; }
        nav a:hover, nav a.active { color: var(--gold); background: rgba(212,175,55,0.1); }

        .currency-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 5px 15px;
            border-radius: 50px; border: 1px solid rgba(212, 175, 55, 0.3);
        }

        #currSelect { background: none; color: #fff; border: none; font-family: 'Cairo'; font-weight: 700; outline: none; }
        #currSelect option { background: #000; color: #fff; }

        .container { max-width: 1100px; margin: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; clear: both; }

        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .card.out-of-stock { filter: grayscale(1); opacity: 0.6; pointer-events: none; }
        .card img { width: 100%; height: 160px; object-fit: cover; } 
        .card-content { padding: 15px; text-align: center; }

        .discount-badge { position: absolute; top: 10px; right: 10px; background: var(--discount-red); color: white; padding: 4px 10px; border-radius: 5px; font-weight: 800; font-size: 0.75rem; z-index: 10; }

        .timer-display {
            position: absolute; bottom: 65px; left: 10px;
            color: var(--discount-red); font-weight: 800; font-size: 10px;
            background: rgba(0, 0, 0, 0.7); padding: 3px 8px; border-radius: 4px; direction: ltr;
        }

        .price { color: #fff; font-size: 1.1rem; font-weight: 700; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-left: 8px; }

        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; font-weight: 800; border-radius: 8px; margin-top: 10px; transition: 0.3s; font-size: 0.9rem; pointer-events: auto; }
        .buy-btn:hover { background: #fff; }

        #adminSection { display: none; margin-bottom: 30px; animation: fadeIn 0.5s; padding: 0 20px; }
        .admin-flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .admin-box { flex: 1; min-width: 250px; background: #111; padding: 20px; border: 1px solid #333; border-radius: 15px; }
        .admin-input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }

        #paymentScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .payment-title { color: var(--gold); font-weight: 900; font-size: 1.6rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
        .qr-img { width: 180px; height: 180px; display: block; background: white; padding: 10px; border-radius: 10px; }
        .payment-note { color: #ff4d4d; font-size: 0.9rem; font-weight: 600; line-height: 1.6; max-width: 250px; margin: 10px 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div id="custom-cursor"></div>

<nav>
    <a href="#" onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
    <a href="#" onclick="showSection('الـسيارات🚗')">سيارات</a>
    <a href="#" onclick="showSection('الـعـقارات🏘️')">عقارات</a>
    <a href="#" onclick="showSection('الـمـتاجـر🏪')">متاجر</a>
    <div class="currency-container">
        <select id="currSelect" onchange="updateCurrency()">
            <option value="SR">SR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KWD">KWD</option>
        </select>
    </div>
</nav>

<div class="container">
    <div id="adminSection">
        <div class="admin-flex">
            <div class="admin-box" style="border-top: 4px solid var(--gold);">
                <h4>إدارة المنتجات</h4>
                <input type="hidden" id="editIndex" value="">
                <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
                <input type="number" id="pPrice" class="admin-input" placeholder="السعر (SR)">
                <select id="pCategory" class="admin-input">
                    <option value="الـسيارات🚗">سيارات</option>
                    <option value="الـعـقارات🏘️">عقارات</option>
                    <option value="الـمـتاجـر🏪">متاجر</option>
                </select>
                <input type="number" id="pStock" class="admin-input" placeholder="المخزون">
                <input type="text" id="pImg" class="admin-input" placeholder="رابط الصورة">
                <button onclick="saveProduct()" class="buy-btn">حفظ المنتج ✅</button>
            </div>
            
            <div class="admin-box" style="border-top: 4px solid var(--discount-red);">
                <h4>نظام الخصم المتطور 🔥</h4>
                <label style="font-size: 12px; color: gray;">نوع التطبيق:</label>
                <select id="discTargetType" class="admin-input" onchange="toggleDiscTarget()">
                    <option value="single">منتج معين</option>
                    <option value="category">حسب القسم</option>
                    <option value="all">جميع المنتجات</option>
                    <option value="code">كود خصم جديد</option>
                </select>

                <div id="singleTargetBox">
                    <select id="discProduct" class="admin-input"></select>
                </div>

                <div id="categoryTargetBox" style="display:none;">
                    <select id="discCat" class="admin-input">
                        <option value="الـسيارات🚗">قسم السيارات</option>
                        <option value="الـعـقارات🏘️">قسم العقارات</option>
                        <option value="الـمـتاجـر🏪">قسم المتاجر</option>
                    </select>
                </div>

                <div id="codeTargetBox" style="display:none;">
                    <input type="text" id="discCodeName" class="admin-input" placeholder="أدخل كود الخصم (مثال: AR50)">
                </div>

                <input type="number" id="discPercent" class="admin-input" placeholder="نسبة الخصم %">
                <input type="number" id="discHours" class="admin-input" placeholder="المدة بالساعات">
                <button onclick="applyAdvancedDiscount()" class="buy-btn" style="background: var(--discount-red); color:white;">تطبيق الخصم الآن</button>
            </div>
        </div>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#222; color:white; margin-top:15px;">إغلاق لوحة التحكم</button>
    </div>

    <div id="homeSection">
        <div class="section-header"><h2>الأكثر مبيعاً 🔥</h2></div>
        <div class="grid" id="bestSellerGrid"></div>
    </div>
    <div id="categorySection" style="display:none;">
        <div class="section-header"><h2 id="categoryTitle"></h2></div>
        <div class="grid" id="categoryGrid"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content" id="modalMain">
        <h2 id="modalTitle" style="color:var(--gold)"></h2>
        <select id="usageType" class="admin-input">
            <option value="شخصي">استعمال شخصي</option>
            <option value="هدية">هدية (منشن)</option>
        </select>
        <input type="number" id="orderQty" class="admin-input" min="1" value="1">
        <input type="text" id="orderDiscord" class="admin-input" placeholder="ايدي ديسكوردك">
        <div style="border: 1px dashed var(--gold); padding: 10px; border-radius: 10px; margin: 10px 0;">
            <input type="text" id="appliedCoupon" class="admin-input" placeholder="كود الخصم (إن وجد)" style="margin:0; width: 70%; display: inline-block;">
            <button onclick="checkCoupon()" style="width: 25%; padding: 10px; background: var(--gold); border: none; border-radius: 8px; font-weight: bold;">فحص</button>
        </div>
        <div id="couponMsg" style="font-size: 12px; margin-bottom: 10px;"></div>
        <button onclick="goToPayment()" class="buy-btn">متابعة الدفع</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-top:10px;">إلغاء</button>
    </div>
    
    <div class="modal-content" id="paymentScreen" style="display:none;">
        <div class="payment-title">تأكيد الدفع</div>
        <div id="finalPriceDisplay" style="font-weight: bold; color: white; margin-bottom: 10px;"></div>
        <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=AR_PAY" alt="QR Code">
        <span class="payment-note">يجب التحويل عبر البركود قبل فتح تذكرة</span>
        <button onclick="finishOrder()" class="buy-btn" id="finalBtn">فتح تذكرة الآن ✅</button>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:25px; left:25px; background:#222; color:var(--gold); border:1px solid var(--gold); width:50px; height:50px; border-radius:50%; z-index:10001; font-size:22px;">⚙️</button>

<script>
    const BOT_URL = "https://ar-store-i6tw.onrender.com/open-ticket";
    const rates = { "SR": 1, "USD": 0.27, "EUR": 0.25, "KWD": 0.082 };
    let currentCurr = "SR";
    let products = JSON.parse(localStorage.getItem('ar_store_v12')) || [];
    let coupons = JSON.parse(localStorage.getItem('ar_coupons')) || {};
    let currentView = 'home';
    let currentIndex = null;
    let activeCouponPercent = 0;

    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => { 
        cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; 
    });

    function toggleDiscTarget() {
        const type = document.getElementById('discTargetType').value;
        document.getElementById('singleTargetBox').style.display = type === 'single' ? 'block' : 'none';
        document.getElementById('categoryTargetBox').style.display = type === 'category' ? 'block' : 'none';
        document.getElementById('codeTargetBox').style.display = type === 'code' ? 'block' : 'none';
    }

    function applyAdvancedDiscount() {
        const type = document.getElementById('discTargetType').value;
        const percent = parseInt(document.getElementById('discPercent').value);
        const hours = parseFloat(document.getElementById('discHours').value);
        const expiry = new Date().getTime() + (hours * 3600000);

        if(isNaN(percent) || isNaN(hours)) return alert("يرجى إدخال قيم صحيحة");

        if(type === 'single') {
            const idx = document.getElementById('discProduct').value;
            products[idx].discount = { percent, expiry };
        } else if(type === 'all') {
            products.forEach(p => p.discount = { percent, expiry });
        } else if(type === 'category') {
            const cat = document.getElementById('discCat').value;
            products.forEach(p => { if(p.category === cat) p.discount = { percent, expiry }; });
        } else if(type === 'code') {
            const code = document.getElementById('discCodeName').value.toUpperCase();
            if(!code) return alert("أدخل اسم الكود");
            coupons[code] = { percent, expiry };
            localStorage.setItem('ar_coupons', JSON.stringify(coupons));
            alert(`تم تفعيل كود الخصم: ${code}`);
            return;
        }

        saveAll();
        alert("تم تطبيق الخصم بنجاح! 🔥");
        render();
    }

    function checkCoupon() {
        const code = document.getElementById('appliedCoupon').value.toUpperCase();
        const msg = document.getElementById('couponMsg');
        const now = new Date().getTime();

        if(coupons[code] && coupons[code].expiry > now) {
            activeCouponPercent = coupons[code].percent;
            msg.innerText = `تم تطبيق خصم الكود ${activeCouponPercent}% ✅`;
            msg.style.color = "#2ecc71";
        } else {
            activeCouponPercent = 0;
            msg.innerText = "كود غير صحيح أو منتهي الصلاحية ❌";
            msg.style.color = "#ff4d4d";
        }
    }

    function getRemainingTime(expiry) {
        const diff = expiry - new Date().getTime();
        if (diff <= 0) return null;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        return `${h}h:${m}m`;
    }

    function render() {
        const now = new Date().getTime();
        const bestGrid = document.getElementById('bestSellerGrid');
        const catGrid = document.getElementById('categoryGrid');
        bestGrid.innerHTML = ''; catGrid.innerHTML = '';
        document.getElementById('discProduct').innerHTML = products.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');

        const isAdminOpen = document.getElementById('adminSection').style.display === 'block';

        products.forEach((p, i) => {
            let price = p.price;
            let hasDisc = (p.discount && p.discount.expiry > now);
            if (hasDisc) price = p.price - (p.price * (p.discount.percent / 100));

            const convPrice = (price * rates[currentCurr]).toFixed(2);
            const convOld = (p.price * rates[currentCurr
