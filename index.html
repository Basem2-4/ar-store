<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --black: #0a0a0a; --card-bg: #151515; --nav-bg: #111; --discount-red: #ff4d4d; }
        
        /* --- المؤشر الذهبي المطور --- */
        * { cursor: none !important; }
        #custom-cursor {
            position: fixed; width: 28px; height: 28px;
            background: url('https://cur.cursors-4u.net/games/gam-13/gam1214.cur'), auto;
            background-size: contain; pointer-events: none; z-index: 1000000;
            filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.8));
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 80px; overflow-x: hidden; }
        nav { 
            position: fixed; top: 0; width: 100%; background: var(--nav-bg); 
            border-bottom: 2px solid var(--gold); display: flex; justify-content: center; 
            align-items: center; gap: 25px; padding: 15px 0; z-index: 9000;
        }
        nav a { color: #fff; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 5px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--gold); background: rgba(212,175,55,0.1); }

        .container { max-width: 1100px; margin: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }

        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.4s; }
        .card.out-of-stock img { filter: grayscale(1); opacity: 0.5; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 15px; text-align: center; }

        .price { color: var(--gold); font-size: 1.1rem; font-weight: 700; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-left: 8px; }
        
        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; font-weight: 800; border-radius: 8px; margin-top: 10px; }
        .buy-btn:disabled { background: #444; color: #888; }
        
        .del-btn { background: #ff0000 !important; color: white !important; flex: 1; border: none; padding: 5px; border-radius: 5px; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        
        #adminSection { display: none; background: #111; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .admin-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; }
    </style>
</head>
<body>

<div id="custom-cursor"></div>

<nav>
    <a href="#" onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
    <a href="#" onclick="showSection('الـسيارات🚗')">سيارات</a>
    <a href="#" onclick="showSection('الـعـقارات🏘️')">عقارات</a>
    <a href="#" onclick="showSection('الـمـتاجـر🏪')">متاجر</a>
    <select id="currSelect" onchange="updateCurrency()" style="background: #222; color: gold; border: 1px solid gold; padding: 5px; border-radius: 5px;">
        <option value="SR">SR</option>
        <option value="USD">USD</option>
    </select>
</nav>

<div class="container">
    <div id="adminSection">
        <h3 style="color:var(--gold)">إدارة المتجر ⚙️</h3>
        <input type="hidden" id="editIndex">
        <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
        <input type="number" id="pPrice" class="admin-input" placeholder="السعر بالريال">
        <input type="number" id="pStock" class="admin-input" placeholder="المخزون">
        <input type="text" id="pImg" class="admin-input" placeholder="رابط الصورة">
        <select id="pCategory" class="admin-input">
            <option value="الـسيارات🚗">سيارات</option>
            <option value="الـعـقارات🏘️">عقارات</option>
            <option value="الـمـتاجـر🏪">متاجر</option>
        </select>
        <button onclick="saveProduct()" class="buy-btn">حفظ المنتج ✅</button>
        <hr border="1" color="#333">
        <h4 style="color:var(--discount-red)">نظام الخصومات</h4>
        <select id="discProduct" class="admin-input"></select>
        <input type="number" id="discPercent" class="admin-input" placeholder="نسبة الخصم %">
        <input type="number" id="discHours" class="admin-input" placeholder="المدة بالساعات">
        <button onclick="applyDiscount()" class="buy-btn" style="background:var(--discount-red); color:white;">تفعيل الخصم 🔥</button>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#333; color:white;">إغلاق</button>
    </div>

    <div id="homeSection">
        <h2 style="color:var(--gold)">العروض الحالية 🔥</h2>
        <div class="grid" id="bestSellerGrid"></div>
    </div>

    <div id="categorySection" style="display:none;">
        <h2 id="categoryTitle" style="color:var(--gold)"></h2>
        <div class="grid" id="categoryGrid"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content" id="modalMain">
        <h2 id="modalTitle" style="color:var(--gold)"></h2>
        <input type="text" id="orderDiscord" class="admin-input" placeholder="ايدي ديسكوردك">
        <input type="number" id="orderQty" class="admin-input" value="1" min="1">
        <select id="usageType" class="admin-input">
            <option value="شخصي">استخدام شخصي</option>
            <option value="هدية">هدية لشخص آخر</option>
        </select>
        <button onclick="goToPayment()" class="buy-btn">متابعة للدفع</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-top:10px;">إلغاء</button>
    </div>
    <div class="modal-content" id="paymentScreen" style="display:none;">
        <h2 style="color:var(--gold)">تأكيد التحويل</h2>
        <p>قم بمسح الكود للتحويل وإتمام الطلب</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=AR_STORE_PAY" style="background:white; padding:10px; border-radius:10px;">
        <button onclick="finishOrder()" id="finalBtn" class="buy-btn">لقد قمت بالتحويل، افتح تذكرة ✅</button>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:20px; left:20px; border-radius:50%; width:50px; height:50px; background:#222; color:gold; border:1px solid gold; font-size:20px; z-index:10001;">⚙️</button>

<script src="index.js"></script>
</body>
</html>
