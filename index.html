<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-glow: 0 0 15px rgba(212, 175, 55, 0.8);
            --black: #0a0a0a; 
            --card-bg: rgba(21, 21, 21, 0.9); 
            --nav-bg: transparent; 
            --discount-red: #ff4d4d; 
        }

        /* --- المؤشر الذهبي المطور --- */
        * { cursor: none !important; }
        button, a, select, input { cursor: none !important; pointer-events: auto !important; }

        #custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp?ex=69536e3b&is=69521cbb&hm=1b0b626b03dc2254beb7ea42eb3975028f74e1b0f6a2c6dcde4efd80665e6e34&') no-repeat center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px #D4AF37) brightness(1.2);
            transition: transform 0.08s ease-out;
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 140px; overflow-x: hidden; position: relative; }

        #section-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            filter: blur(8px) brightness(0.25);
            opacity: 0.7;
        }

        /* --- القائمة العلوية المحدثة --- */
        nav { 
            position: fixed; 
            top: 20px; 
            width: 100%; 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 5%; 
            z-index: 9000;
            box-sizing: border-box;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            border-radius: 15px;
            box-shadow: var(--gold-glow);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: var(--gold-glow);
        }

        .brand-img { width: 40px; height: 40px; object-fit: contain; }

        nav a { color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; }
        nav a:hover, nav a.active { color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        .gold-line {
            position: fixed;
            top: 115px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            box-shadow: 0 0 10px var(--gold);
            z-index: 8999;
        }

        /* --- الحاويات --- */
        .container { 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 1; 
        }

        .section-header h2 {
            color: var(--gold);
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 30px;
            border-right: 5px solid var(--gold);
            padding-right: 15px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            width: 100%;
        }

        /* --- البطاقات --- */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px); 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.05); 
            overflow: hidden; 
            position: relative; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        .card:hover { 
            transform: translateY(-10px); 
            border-color: var(--gold); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.2); 
        }

        .card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid rgba(212, 175, 55, 0.2); } 
        .card-content { padding: 20px; text-align: center; }

        .discount-badge { 
            position: absolute; top: 15px; right: 15px; 
            background: var(--discount-red); color: white; 
            padding: 5px 12px; border-radius: 8px; 
            font-weight: 900; font-size: 0.8rem; z-index: 10;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
        }

        .timer-display {
            display: inline-block;
            margin-top: 10px;
            color: var(--discount-red); font-weight: 800; font-size: 11px;
            background: rgba(255, 77, 77, 0.1); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--discount-red);
        }

        .price { color: #fff; font-size: 1.3rem; font-weight: 800; display: block; margin-top: 5px; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.9rem; margin-left: 10px; }

        .buy-btn { 
            background: var(--gold); color: #000; border: none; 
            padding: 12px; width: 100%; font-weight: 900; 
            border-radius: 10px; margin-top: 15px; transition: 0.3s; 
            font-size: 1rem; cursor: pointer;
        }
        .buy-btn:hover { background: #fff; transform: scale(1.02); box-shadow: var(--gold-glow); }

        /* --- لوحة التحكم --- */
        #adminSection { 
            background: rgba(10,10,10,0.95); 
            border-radius: 20px; border: 2px solid var(--gold); 
            margin-bottom: 40px; padding: 30px; display: none;
            animation: fadeIn 0.5s ease;
        }

        .admin-box { 
            background: rgba(255,255,255,0.03); 
            padding: 20px; border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #000; border: 1px solid #333; 
            color: white; border-radius: 10px; font-family: 'Cairo';
            box-sizing: border-box; 
        }

        /* --- المودال (النافذة المنبثقة) --- */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.95); 
            z-index: 99999; justify-content: center; align-items: center; 
            backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: #111; padding: 40px; border-radius: 25px; 
            border: 1px solid var(--gold); width: 90%; max-width: 450px; text-align: center; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* التجاوب مع الجوال */
        @media (max-width: 768px) {
            body { padding-top: 180px; }
            nav { flex-direction: column; gap: 15px; }
            .nav-wrapper { flex-wrap: wrap; justify-content: center; padding: 10px; font-size: 0.8rem; }
            .gold-line { top: 165px; }
            .brand-container { order: -1; }
        }
    </style>
</head>
<body>

<div id="custom-cursor"></div>
<div id="section-bg"></div>
<div class="gold-line"></div>

<nav id="navbar">
    <div class="nav-wrapper" id="navMenu">
        <a href="#" onclick="showSection('home')" id="nav-home">الرئيسية</a>
        <a href="#" onclick="showSection('الـسيارات🚗')">السيارات</a>
        <a href="#" onclick="showSection('الـعـقارات🏘️')">العقارات</a>
        <a href="#" onclick="showSection('الـمـتاجـر🏪')">المتاجر</a>
        <div class="currency-container" style="display:flex; align-items:center; background:rgba(255,255,255,0.1); padding:2px 10px; border-radius:10px;">
            <select id="currSelect" onchange="updateCurrency()" style="background:none; color:white; border:none; font-family:'Cairo'; font-weight:700; outline:none;">
                <option value="SR">SR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="KWD">KWD</option>
            </select>
        </div>
    </div>

    <div class="brand-container">
        <div class="brand-logo">Alamariyah RP</div>
        <img src="https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp?ex=69536e3b&is=69521cbb&hm=1b0b626b03dc2254beb7ea42eb3975028f74e1b0f6a2c6dcde4efd80665e6e34&" class="brand-img" alt="Logo">
    </div>
</nav>

<div class="container">
    <div id="adminSection">
        <h3 style="color:var(--gold); margin-top:0;">🛠️ لوحة الإدارة الاحترافية</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            <div class="admin-box">
                <h4>📦 إدارة المنتجات</h4>
                <input type="hidden" id="editIndex" value="">
                <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
                <input type="number" id="pPrice" class="admin-input" placeholder="السعر (SR)">
                <select id="pCategory" class="admin-input">
                    <option value="الـسيارات🚗">سيارات</option>
                    <option value="الـعـقارات🏘️">عقارات</option>
                    <option value="الـمـتاجـر🏪">متاجر</option>
                </select>
                <input type="number" id="pStock" class="admin-input" placeholder="الكمية المتوفرة">
                <input type="text" id="pImg" class="admin-input" placeholder="رابط صورة المنتج">
                <button onclick="saveProduct()" class="buy-btn">حفظ وتحديث المتجر ✅</button>
            </div>

            <div class="admin-box">
                <h4>🔥 نظام الخصومات</h4>
                <select id="discScope" class="admin-input">
                    <option value="single">منتج محدد</option>
                    <option value="الـسيارات🚗">قسم السيارات</option>
                    <option value="الـعـقارات🏘️">قسم العقارات</option>
                    <option value="الـمـتاجـر🏪">قسم المتاجر</option>
                    <option value="all">كل المتجر</option>
                    <option value="coupon">إنشاء كود خصم</option>
                </select>
                <div id="productField"><select id="discProduct" class="admin-input"></select></div>
                <div id="couponField" style="display:none;"><input type="text" id="couponCode" class="admin-input" placeholder="أدخل الكود (مثال: SAVE20)"></div>
                <input type="number" id="discPercent" class="admin-input" placeholder="نسبة الخصم %">
                <input type="number" id="discHours" class="admin-input" placeholder="المدة بالساعات">
                <button onclick="applyAdvancedDiscount()" class="buy-btn" style="background:var(--discount-red); color:white;">تفعيل العرض فوراً</button>
            </div>

            <div class="admin-box">
                <h4>🎨 مظهر القسم</h4>
                <input type="text" id="bgUrlInput" class="admin-input" placeholder="رابط الخلفية الجديد">
                <button onclick="updateSectionBG()" class="buy-btn" style="background:#3498db; color:white;">تغيير الخلفية</button>
                <button onclick="resetBackgrounds()" class="buy-btn" style="background:#555; color:white; margin-top:10px;">إعادة الافتراضي</button>
            </div>
        </div>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#222; color:white; margin-top:20px;">إغلاق اللوحة</button>
    </div>

    <div id="homeSection">
        <div class="section-header"><h2>أفضل العروض 🔥</h2></div>
        <div class="grid" id="bestSellerGrid"></div>
    </div>
    
    <div id="categorySection" style="display:none;">
        <div class="section-header"><h2 id="categoryTitle"></h2></div>
        <div class="grid" id="categoryGrid"></div>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:20px; left:20px; width:40px; height:40px; border-radius:50%; background:rgba(212,175,55,0.2); border:1px solid var(--gold); z-index:10000; cursor:pointer; opacity:0.5;"></button>

<div id="orderModal" class="modal">
    <div class="modal-content" id="modalMain">
        <h2 id="modalTitle" style="color:var(--gold); margin-bottom:20px;"></h2>
        <select id="usageType" class="admin-input">
            <option value="شخصي">استعمال شخصي</option>
            <option value="هدية">إهداء لصديق</option>
        </select>
        <input type="number" id="orderQty" class="admin-input" min="1" value="1" placeholder="الكمية">
        <input type="text" id="orderDiscord" class="admin-input" placeholder="اسمك في ديسكورد أو الايدي">
        <input type="text" id="orderCoupon" class="admin-input" placeholder="كود الخصم (إن وجد)">
        <button onclick="goToPayment()" class="buy-btn">تأكيد ومتابعة</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-top:15px; cursor:pointer;">إلغاء الطلب</button>
    </div>
    
    <div class="modal-content" id="paymentScreen" style="display:none;">
        <h2 style="color:var(--gold)">إتمام عملية الدفع</h2>
        <div id="paymentSummary" style="margin: 15px 0; font-weight: bold; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;"></div>
        <img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=AR_STORE_PAYMENT" style="background:white; padding:10px; border-radius:15px; margin:15px 0;">
        <p style="color:var(--discount-red); font-size:0.85rem;">يرجى تصوير إيصال التحويل لتقديمه في التذكرة</p>
        <button onclick="finishOrder()" class="buy-btn" id="finalBtn">فتح تذكرة استلام ✅</button>
    </div>
</div>

<script>
    // --- الإعدادات والروابط ---
    const BASE_URL = "https://ar-store-i6tw.onrender.com"; 
    const BOT_URL = `${BASE_URL}/open-ticket`;
    const DATA_URL = `${BASE_URL}/get-data`; 
    const SAVE_URL = `${BASE_URL}/save-data`; 

    let products = [];
    let coupons = [];
    let customSectionImages = {};
    let currentCurr = "SR";
    let currentView = 'home';
    let currentIndex = null;
    let finalOrderPrice = 0;

    const rates = { "SR": 1, "USD": 0.27, "EUR": 0.25, "KWD": 0.082 };
    const sectionImages = {
        'home': 'https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=2070',
        'الـسيارات🚗': 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070',
        'الـعـقارات🏘️': 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=2070',
        'الـمـتاجـر🏪': 'https://images.unsplash.com/photo-1534723452862-4c874018d66d?q=80&w=2070'
    };

    // الماوس الذهبي
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => { 
        cursor.style.left = e.clientX + 'px'; 
        cursor.style.top = e.clientY + 'px'; 
    });

    // جلب البيانات
    async function loadDataFromServer() {
        try {
            const res = await fetch(DATA_URL);
            const data = await res.json();
            if(data) {
                products = data.products || [];
                coupons = data.coupons || [];
                customSectionImages = data.backgrounds || {};
            }
        } catch (e) {
            products = JSON.parse(localStorage.getItem('ar_store_v12')) || [];
            coupons = JSON.parse(localStorage.getItem('ar_coupons_v12')) || [];
            customSectionImages = JSON.parse(localStorage.getItem('ar_custom_bgs')) || {};
        }
        render();
        showSection(currentView);
    }

    async function saveAll() { 
        localStorage.setItem('ar_store_v12', JSON.stringify(products));
        localStorage.setItem('ar_coupons_v12', JSON.stringify(coupons));
        localStorage.setItem('ar_custom_bgs', JSON.stringify(customSectionImages));
        try {
            await fetch(SAVE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ products, coupons, backgrounds: customSectionImages })
            });
        } catch(e) {}
    }

    function render() {
        const now = new Date().getTime();
        const bestGrid = document.getElementById('bestSellerGrid');
        const catGrid = document.getElementById('categoryGrid');
        bestGrid.innerHTML = ''; catGrid.innerHTML = '';
        
        document.getElementById('discProduct').innerHTML = products.map((p, i) => `<option value="${i}">${p.name}</option>`).join('');
        const isAdmin = document.getElementById('adminSection').style.display === 'block';

        products.forEach((p, i) => {
            let price = p.price;
            let hasDisc = (p.discount && p.discount.expiry > now);
            if (hasDisc) price = p.price - (p.price * (p.discount.percent / 100));

            const convPrice = (price * rates[currentCurr]).toFixed(2);
            const convOld = (p.price * rates[currentCurr]).toFixed(2);
            
            const cardHtml = `
                <div class="card ${p.stock <= 0 ? 'out-of-stock' : ''}">
                    ${hasDisc ? `<div class="discount-badge">-${p.discount.percent}%</div>` : ''}
                    <img src="${p.img || 'https://via.placeholder.com/300x180'}" onerror="this.src='https://via.placeholder.com/300x180?text=AR+STORE'">
                    <div class="card-content">
                        <h3 style="margin:0 0 10px 0; font-size:1.1rem;">${p.name}</h3>
                        <div>
                            ${hasDisc ? `<span class="old-price">${convOld}</span>` : ''}
                            <span class="price">${convPrice} ${currentCurr}</span>
                        </div>
                        <p style="font-size:11px; color:#666; margin:10px 0;">المخزون: ${p.stock}</p>
                        ${hasDisc ? `<div class="timer-display" id="timer-${i}">جاري الحساب...</div>` : ''}
                        <button class="buy-btn" onclick="openOrder(${i})">${p.stock <= 0 ? 'نفذت الكمية' : 'طلب المنتج'}</button>
                        ${isAdmin ? `<div style="display:flex; gap:5px; margin-top:10px;">
                            <button onclick="editP(${i})" style="flex:1; padding:5px; border-radius:5px; background:#444; color:gold; border:none; font-weight:bold;">تعديل</button>
                            <button onclick="deleteP(${i})" style="flex:1; padding:5px; border-radius:5px; background:#444; color:red; border:none; font-weight:bold;">حذف</button>
                        </div>` : ''}
                    </div>
                </div>`;

            if (currentView === 'home' && (hasDisc || i < 4)) bestGrid.innerHTML += cardHtml;
            if (p.category === currentView) catGrid.innerHTML += cardHtml;
            
            if(hasDisc) updateTimer(i, p.discount.expiry);
        });
    }

    function updateTimer(idx, expiry) {
        setInterval(() => {
            const el = document.getElementById(`timer-${idx}`);
            if(!el) return;
            const diff = expiry - new Date().getTime();
            if(diff <= 0) { el.innerText = "انتهى العرض"; return; }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            el.innerText = `ينتهي خلال: ${h}س ${m}د ${s}ث`;
        }, 1000);
    }

    function showSection(s) {
        currentView = s;
        const bg = customSectionImages[s] || sectionImages[s];
        document.getElementById('section-bg').style.backgroundImage = `url('${bg}')`;
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        
        if(s === 'home') {
            document.getElementById('homeSection').style.display = 'block';
            document.getElementById('categorySection').style.display = 'none';
            document.getElementById('nav-home').classList.add('active');
        } else {
            document.getElementById('homeSection').style.display = 'none';
            document.getElementById('categorySection').style.display = 'block';
            document.getElementById('categoryTitle').innerText = `قسم ${s.replace(/🚗|🏘️|🏪/g, '')}`;
            document.querySelectorAll('nav a').forEach(a => {
                if(a.innerText.includes(s.replace(/🚗|🏘️|🏪/g, ''))) a.classList.add('active');
            });
        }
        render();
    }

    function saveProduct() {
        const idx = document.getElementById('editIndex').value;
        const p = {
            name: document.getElementById('pName').value,
            price: parseFloat(document.getElementById('pPrice').value),
            category: document.getElementById('pCategory').value,
            stock: parseInt(document.getElementById('pStock').value),
            img: document.getElementById('pImg').value,
            sales: 0, discount: null
        };
        if(!p.name || isNaN(p.price)) return alert("يرجى ملء الحقول الأساسية");
        if(idx === "") products.push(p); else products[idx] = {...products[idx], ...p};
        document.getElementById('editIndex').value = "";
        saveAll(); render(); alert("تم التحديث بنجاح!");
    }

    function applyAdvancedDiscount() {
        const scope = document.getElementById('discScope').value;
        const percent = parseInt(document.getElementById('discPercent').value);
        const expiry = new Date().getTime() + (parseFloat(document.getElementById('discHours').value) * 3600000);

        if(scope === 'coupon') {
            coupons.push({ code: document.getElementById('couponCode').value, percent, expiry });
        } else {
            products.forEach((p, i) => {
                if(scope === 'all' || p.category === scope || (scope === 'single' && i == document.getElementById('discProduct').value)) {
                    p.discount = { percent, expiry };
                }
            });
        }
        saveAll(); render(); alert("تم تفعيل الخصم!");
    }

    function openOrder(i) {
        currentIndex = i;
        document.getElementById('modalTitle').innerText = products[i].name;
        document.getElementById('modalMain').style.display = 'block';
        document.getElementById('paymentScreen').style.display = 'none';
        document.getElementById('orderModal').style.display = 'flex';
    }

    function goToPayment() {
        const qty = parseInt(document.getElementById('orderQty').value);
        const discord = document.getElementById('orderDiscord').value;
        const couponInput = document.getElementById('orderCoupon').value.trim();
        if(!discord) return alert("يرجى إدخال معرف الديسكورد");

        let p = products[currentIndex];
        let price = p.price;
        if(p.discount && p.discount.expiry > new Date().getTime()) price -= (price * p.discount.percent / 100);
        
        const cp = coupons.find(c => c.code === couponInput && c.expiry > new Date().getTime());
        if(cp) price -= (price * cp.percent / 100);

        finalOrderPrice = (price * qty).toFixed(2);
        document.getElementById('paymentSummary').innerText = `المطلوب تحويله: ${finalOrderPrice} SR`;
        document.getElementById('modalMain').style.display = 'none';
        document.getElementById('paymentScreen').style.display = 'flex';
    }

    async function finishOrder() {
        const btn = document.getElementById('finalBtn');
        btn.disabled = true; btn.innerText = "جاري الإرسال...";
        try {
            const res = await fetch(BOT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    productName: products[currentIndex].name,
                    buyerId: document.getElementById('orderDiscord').value,
                    qty: document.getElementById('orderQty').value,
                    total: finalOrderPrice,
                    usage: document.getElementById('usageType').value
                })
            });
            const data = await res.json();
            if(data.success) { alert("تم فتح التذكرة بنجاح!"); location.reload(); }
            else { alert("خطأ: " + data.error); btn.disabled = false; }
        } catch(e) { alert("فشل الاتصال بالبوت"); btn.disabled = false; }
    }

    function openAdmin() { if(prompt("كلمة المرور:") === "admin123") { document.getElementById('adminSection').style.display = 'block'; render(); } }
    function closeAdmin() { document.getElementById('adminSection').style.display = 'none'; render(); }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
    function updateCurrency() { currentCurr = document.getElementById('currSelect').value; render(); }
    function deleteP(i) { if(confirm("حذف؟")) { products.splice(i,1); saveAll(); render(); } }
    function editP(i) {
        const p = products[i];
        document.getElementById('editIndex').value = i;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pStock').value = p.stock;
        document.getElementById('pImg').value = p.img;
        window.scrollTo(0,0);
    }
    function updateSectionBG() {
        customSectionImages[currentView] = document.getElementById('bgUrlInput').value;
        saveAll(); showSection(currentView);
    }
    function resetBackgrounds() { customSectionImages = {}; saveAll(); showSection(currentView); }

    document.getElementById('discScope').onchange = function() {
        document.getElementById('productField').style.display = this.value === 'single' ? 'block' : 'none';
        document.getElementById('couponField').style.display = this.value === 'coupon' ? 'block' : 'none';
    };

    window.onload = loadDataFromServer;
</script>
</body>
</html>
