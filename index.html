<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --black: #0a0a0a; 
            --card-bg: #151515; 
            --nav-bg: #111; 
            --discount-red: #ff4d4d; 
        }

        /* --- المؤشر الذهبي المطور --- */
        * { cursor: none !important; }
        button, a, select, input { cursor: none !important; pointer-events: auto !important; }

        #custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp?ex=69536e3b&is=69521cbb&hm=1b0b626b03dc2254beb7ea42eb3975028f74e1b0f6a2c6dcde4efd80665e6e34&') no-repeat center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px #D4AF37) brightness(1.2);
            transition: transform 0.1s ease-out;
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 80px; overflow-x: hidden; }

        /* ترويسة الأقسام */
        h2 {
            color: var(--gold);
            font-weight: 900;
            margin: 40px 0 25px 0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 10px 25px;
            background: rgba(212, 175, 55, 0.05);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 50px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            float: right;
            clear: both;
        }

        .section-header { width: 100%; display: block; overflow: hidden; margin-bottom: 20px; padding: 0 20px; }

        nav { 
            position: fixed; top: 0; width: 100%; background: var(--nav-bg); 
            border-bottom: 2px solid var(--gold); display: flex; justify-content: center; 
            align-items: center; gap: 20px; padding: 15px 0; z-index: 9000;
        }

        nav a { color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 8px 15px; border-radius: 5px; }
        nav a:hover, nav a.active { color: var(--gold); background: rgba(212,175,55,0.1); }

        .currency-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 5px 15px;
            border-radius: 50px; border: 1px solid rgba(212, 175, 55, 0.3);
        }

        #currSelect { background: none; color: #fff; border: none; font-family: 'Cairo'; font-weight: 700; outline: none; }

        .container { max-width: 1100px; margin: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; clear: both; }

        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .card img { width: 100%; height: 160px; object-fit: cover; } 
        .card-content { padding: 15px; text-align: center; }

        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; font-weight: 800; border-radius: 8px; margin-top: 10px; transition: 0.3s; font-size: 0.9rem; pointer-events: auto; }
        .buy-btn:hover { background: #fff; }

        /* --- تصميم شاشة الدفع الجديد (مرتب) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #151515; padding: 25px; border-radius: 15px; border: 1px solid #333; width: 90%; max-width: 450px; text-align: center; position: relative; }
        
        .payment-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #111;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .side-panel {
            background: var(--gold);
            color: black;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
            min-width: 100px;
        }

        .qr-container {
            background: white;
            padding: 8px;
            border-radius: 8px;
            display: inline-block;
        }

        .qr-container img { width: 140px; height: 140px; display: block; }

        .payment-title-box {
            flex: 1;
            text-align: center;
        }

        .payment-title-box h3 {
            color: var(--gold);
            font-size: 24px;
            margin: 0;
            text-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        .admin-input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } .payment-layout { flex-direction: column; } }
    </style>
</head>
<body>

<div id="custom-cursor"></div>

<nav>
    <a href="#" onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
    <a href="#" onclick="showSection('الـسيارات🚗')">سيارات</a>
    <a href="#" onclick="showSection('الـعـقارات🏘️')">عقارات</a>
    <a href="#" onclick="showSection('الـمـتاجـر🏪')">متاجر</a>
    <div class="currency-container">
        <select id="currSelect" onchange="updateCurrency()">
            <option value="SR">SR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KWD">KWD</option>
        </select>
    </div>
</nav>

<div class="container">
    <div id="adminSection" style="display:none; padding: 20px; background: #111; border-radius: 15px; margin-bottom: 20px;">
        <h4 style="color:var(--gold)">إدارة المنتجات</h4>
        <input type="hidden" id="editIndex" value="">
        <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
        <input type="number" id="pPrice" class="admin-input" placeholder="السعر (SR)">
        <select id="pCategory" class="admin-input">
            <option value="الـسيارات🚗">سيارات</option>
            <option value="الـعـقارات🏘️">عقارات</option>
            <option value="الـمـتاجـر🏪">متاجر</option>
        </select>
        <input type="number" id="pStock" class="admin-input" placeholder="المخزون">
        <input type="text" id="pImg" class="admin-input" placeholder="رابط الصورة">
        <button onclick="saveProduct()" class="buy-btn">حفظ المنتج ✅</button>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#222; color:white;">إغلاق</button>
    </div>

    <div id="homeSection">
        <div class="section-header"><h2>الأكثر مبيعاً 🔥</h2></div>
        <div class="grid" id="bestSellerGrid"></div>
    </div>
    <div id="categorySection" style="display:none;">
        <div class="section-header"><h2 id="categoryTitle"></h2></div>
        <div class="grid" id="categoryGrid"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content" id="modalMain">
        <h2 id="modalTitle" style="color:var(--gold)"></h2>
        <select id="usageType" class="admin-input">
            <option value="شخصي">استعمال شخصي</option>
            <option value="هدية">هدية (منشن)</option>
        </select>
        <input type="number" id="orderQty" class="admin-input" min="1" value="1">
        <input type="text" id="orderDiscord" class="admin-input" placeholder="ايدي ديسكوردك">
        <button onclick="goToPayment()" class="buy-btn">متابعة للدفع</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; margin-top:10px;">إلغاء</button>
    </div>

    <div class="modal-content" id="paymentScreen" style="display:none; max-width: 550px;">
        <div class="payment-layout">
            <div class="side-panel">
                <span>فتح تذكرة</span>
                <span>الآن ✅</span>
            </div>
            
            <div class="qr-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=AR_PAY" alt="QR Code">
            </div>

            <div class="payment-title-box">
                <h3>تأكيد</h3>
                <h3>الدفع</h3>
            </div>
        </div>
        <button onclick="finishOrder()" class="buy-btn" id="finalBtn" style="margin-top:20px; height: 50px; font-size: 1.1rem;">فتح تذكرة الآن ✅</button>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:25px; left:25px; background:#222; color:var(--gold); border:1px solid var(--gold); width:50px; height:50px; border-radius:50%; z-index:10001; font-size:22px;">⚙️</button>

<script>
    const BOT_URL = "https://ar-store-i6tw.onrender.com/open-ticket";
    const rates = { "SR": 1, "USD": 0.27, "EUR": 0.25, "KWD": 0.082 };
    let currentCurr = "SR";
    let products = JSON.parse(localStorage.getItem('ar_store_v12')) || [];
    let currentView = 'home';
    let currentIndex = null;

    // تحريك المؤشر
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => { 
        cursor.style.left = e.clientX + 'px'; 
        cursor.style.top = e.clientY + 'px'; 
    });

    function render() {
        const bestGrid = document.getElementById('bestSellerGrid');
        const catGrid = document.getElementById('categoryGrid');
        bestGrid.innerHTML = ''; catGrid.innerHTML = '';

        products.forEach((p, i) => {
            const convPrice = (p.price * rates[currentCurr]).toFixed(2);
            const cardHtml = `
                <div class="card">
                    <img src="${p.img || 'https://via.placeholder.com/160'}">
                    <div class="card-content">
                        <h3>${p.name}</h3>
                        <p class="price">${convPrice} ${currentCurr}</p>
                        <button class="buy-btn" onclick="openOrder(${i})">اطلب الآن</button>
                    </div>
                </div>`;
            if (currentView === 'home') bestGrid.innerHTML += cardHtml;
            if (p.category === currentView) catGrid.innerHTML += cardHtml;
        });
    }

    async function finishOrder() {
        const btn = document.getElementById('finalBtn');
        const originalText = btn.innerText;
        
        // التغيير المطلوب: جاري فتح التذكرة
        btn.disabled = true;
        btn.innerText = "جاري فتح التذكرة يرجى الانتظار...";
        btn.style.opacity = "0.7";

        const p = products[currentIndex];
        const qty = document.getElementById('orderQty').value;
        const disc = document.getElementById('orderDiscord').value;

        try {
            const response = await fetch(BOT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    productName: p.name,
                    buyerId: disc,
                    qty: qty,
                    total: (p.price * qty),
                    currency: "SR"
                })
            });

            const result = await response.json();
            if (result.success) {
                alert("تم فتح تذكرة بنجاح! ✅");
                location.reload();
            } else {
                alert("خطأ: " + result.error);
                btn.disabled = false;
                btn.innerText = originalText;
                btn.style.opacity = "1";
            }
        } catch (err) {
            alert("فشل الاتصال بالبوت.");
            btn.disabled = false;
            btn.innerText = originalText;
            btn.style.opacity = "1";
        }
    }

    function openOrder(i) {
        currentIndex = i;
        document.getElementById('modalTitle').innerText = products[i].name;
        document.getElementById('modalMain').style.display = 'block';
        document.getElementById('paymentScreen').style.display = 'none';
        document.getElementById('orderModal').style.display = 'flex';
    }

    function goToPayment() {
        if(!document.getElementById('orderDiscord').value) return alert("يرجى كتابة الايدي");
        document.getElementById('modalMain').style.display = 'none';
        document.getElementById('paymentScreen').style.display = 'flex';
    }

    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
    function showSection(s) { currentView = s; render(); }
    function openAdmin() { if(prompt("الباسورد:") === "admin123") document.getElementById('adminSection').style.display = 'block'; }
    function closeAdmin() { document.getElementById('adminSection').style.display = 'none'; }
    function saveProduct() {
        const p = {
            name: document.getElementById('pName').value,
            price: parseFloat(document.getElementById('pPrice').value),
            category: document.getElementById('pCategory').value,
            stock: parseInt(document.getElementById('pStock').value),
            img: document.getElementById('pImg').value
        };
        products.push(p);
        localStorage.setItem('ar_store_v12', JSON.stringify(products));
        render();
        closeAdmin();
    }

    render();
</script>
</body>
</html>
