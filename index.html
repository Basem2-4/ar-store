<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --gold-glow: 0 0 15px rgba(212, 175, 55, 0.8);
            --black: #0a0a0a; 
            --card-bg: #151515; 
            --nav-bg: transparent; 
            --discount-red: #ff4d4d; 
        }

        /* --- المؤشر الذهبي المطور --- */
        * { cursor: none !important; }
        button, a, select, input { cursor: none !important; pointer-events: auto !important; }

        #custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            background: url('https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp?ex=69536e3b&is=69521cbb&hm=1b0b626b03dc2254beb7ea42eb3975028f74e1b0f6a2c6dcde4efd80665e6e34&') no-repeat center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999999;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px #D4AF37) brightness(1.2);
            transition: transform 0.1s ease-out;
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 120px; overflow-x: hidden; position: relative; }

        #section-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            filter: blur(8px) brightness(0.3);
            opacity: 0.6;
        }

        nav { 
            position: fixed; 
            top: 20px; 
            width: 100%; 
            background: var(--nav-bg); 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 50px; 
            z-index: 9000;
            box-sizing: border-box;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--gold);
            border-radius: 15px;
            box-shadow: var(--gold-glow);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--gold-glow);
        }

        .brand-img { width: 45px; height: 45px; object-fit: contain; }

        nav a { color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 8px 15px; border-radius: 5px; }
        nav a:hover, nav a.active { color: var(--gold); text-shadow: var(--gold-glow); }

        .gold-line {
            position: fixed;
            top: 100px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
            z-index: 8999;
        }

        /* --- صندوق اختيار الشركات الجديد --- */
        .car-brands-filter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            width: 100%;
            backdrop-filter: blur(10px);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .brand-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo';
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-btn:hover, .brand-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .brand-btn img { width: 20px; height: 20px; object-fit: contain; }

        .company-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .company-header img { width: 40px; height: 40px; object-fit: contain; }

        .section-header { width: 100%; display: flex; justify-content: flex-start; padding: 0 40px; }
        h2 { color: var(--gold); font-weight: 900; margin: 20px 0; text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }

        .container { max-width: 1400px; margin: 0 auto; padding: 10px 40px; z-index: 1; display: flex; flex-direction: column; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; width: 100%; }

        .card { background: rgba(21, 21, 21, 0.8); backdrop-filter: blur(5px); border-radius: 12px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2); }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; text-align: center; }

        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; font-weight: 800; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        .admin-trigger { position: fixed; bottom: 25px; left: 25px; width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--gold); background: url('https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp') no-repeat center; background-size: 70%; z-index: 10001; }

        #adminSection { width: 100%; display: none; margin-bottom: 30px; background: #111; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .admin-flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .admin-box { flex: 1; min-width: 250px; }
        .admin-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; font-family: 'Cairo'; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
        
        .discount-badge { position: absolute; top: 10px; left: 10px; background: var(--discount-red); color: white; padding: 4px 10px; border-radius: 5px; font-weight: 800; font-size: 0.75rem; }
        .price { color: #fff; font-size: 1.1rem; font-weight: 700; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.8rem; margin-left: 8px; }
    </style>
</head>
<body>

<div id="custom-cursor"></div>
<div id="section-bg"></div>
<div class="gold-line"></div>

<nav id="navbar">
    <div class="nav-wrapper" id="navMenu">
        <a href="#" onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
        <a href="#" onclick="showSection('الـسيارات🚗')">سيارات</a>
        <a href="#" onclick="showSection('الـعـقارات🏘️')">عقارات</a>
        <a href="#" onclick="showSection('الـمـتاجـر🏪')">متاجر</a>
        <div class="currency-container">
            <select id="currSelect" onchange="updateCurrency()">
                <option value="SR">SR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>
    </div>
    <div class="brand-container">
        <div class="brand-logo">Alamariyah RP</div>
        <img src="https://cdn.discordapp.com/attachments/1331789439915266049/1455082018877735103/PsBMwzV.webp" class="brand-img" alt="Logo">
    </div>
</nav>

<div class="container">
    <div id="adminSection">
        <div class="admin-flex">
            <div class="admin-box">
                <h4>إضافة منتج</h4>
                <input type="hidden" id="editIndex" value="">
                <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
                <input type="number" id="pPrice" class="admin-input" placeholder="السعر">
                <select id="pCategory" class="admin-input" onchange="toggleAdminCarBrand()">
                    <option value="الـسيارات🚗">سيارات</option>
                    <option value="الـعـقارات🏘️">عقارات</option>
                    <option value="الـمـتاجـر🏪">متاجر</option>
                </select>
                <select id="pCarBrand" class="admin-input" style="display:block;">
                    <option value="Bmw">BMW</option>
                    <option value="Chevrolet">Chevrolet</option>
                    <option value="Ford">Ford</option>
                    <option value="Kia">Kia</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Doge">Dodge</option>
                    <option value="Rose Roes">Rolls Royce</option>
                    <option value="Honda">Honda</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Mercedes">Mercedes</option>
                    <option value="Lexus">Lexus</option>
                    <option value="Nissan">Nissan</option>
                    <option value="Mazda">Mazda</option>
                    <option value="Geely">Geely</option>
                </select>
                <input type="number" id="pStock" class="admin-input" placeholder="المخزون">
                <input type="text" id="pImg" class="admin-input" placeholder="رابط الصورة">
                <button onclick="saveProduct()" class="buy-btn">حفظ ✅</button>
            </div>

            <div class="admin-box">
                <h4>نظام الخصم</h4>
                <select id="discScope" class="admin-input">
                    <option value="all">كل المتجر</option>
                    <option value="الـسيارات🚗">كل السيارات</option>
                    <optgroup label="شركات معينة">
                        <option value="Bmw">شركة BMW</option>
                        <option value="Geely">شركة Geely</option>
                        <option value="Toyota">شركة Toyota</option>
                        </optgroup>
                </select>
                <input type="number" id="discPercent" class="admin-input" placeholder="النسبة %">
                <input type="number" id="discHours" class="admin-input" placeholder="الساعات">
                <button onclick="applyAdvancedDiscount()" class="buy-btn" style="background:red; color:white;">تفعيل الخصم</button>
            </div>
        </div>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#333; color:white;">إغلاق</button>
    </div>

    <div id="homeSection">
        <div class="section-header"><h2>الأكثر مبيعاً 🔥</h2></div>
        <div class="grid" id="bestSellerGrid"></div>
    </div>

    <div id="categorySection" style="display:none;">
        <div class="section-header"><h2 id="categoryTitle"></h2></div>
        
        <div id="carBrandsFilterBox" class="car-brands-filter" style="display:none;">
            <button class="brand-btn active" onclick="filterByBrand('all')">🌐 الكل</button>
            <button class="brand-btn" onclick="filterByBrand('Bmw')"><img src="https://www.carlogos.org/car-logos/bmw-logo.png"> BMW</button>
            <button class="brand-btn" onclick="filterByBrand('Mercedes')"><img src="https://www.carlogos.org/car-logos/mercedes-benz-logo.png"> Mercedes</button>
            <button class="brand-btn" onclick="filterByBrand('Toyota')"><img src="https://www.carlogos.org/car-logos/toyota-logo.png"> Toyota</button>
            <button class="brand-btn" onclick="filterByBrand('Lexus')"><img src="https://www.carlogos.org/car-logos/lexus-logo.png"> Lexus</button>
            <button class="brand-btn" onclick="filterByBrand('Nissan')"><img src="https://www.carlogos.org/car-logos/nissan-logo.png"> Nissan</button>
            <button class="brand-btn" onclick="filterByBrand('Ford')"><img src="https://www.carlogos.org/car-logos/ford-logo.png"> Ford</button>
            <button class="brand-btn" onclick="filterByBrand('Chevrolet')"><img src="https://www.carlogos.org/car-logos/chevrolet-logo.png"> Chevrolet</button>
            <button class="brand-btn" onclick="filterByBrand('Kia')"><img src="https://www.carlogos.org/car-logos/kia-logo.png"> Kia</button>
            <button class="brand-btn" onclick="filterByBrand('Doge')"><img src="https://www.carlogos.org/car-logos/dodge-logo.png"> Dodge</button>
            <button class="brand-btn" onclick="filterByBrand('Rose Roes')"><img src="https://www.carlogos.org/car-logos/rolls-royce-logo.png"> Rolls Royce</button>
            <button class="brand-btn" onclick="filterByBrand('Honda')"><img src="https://www.carlogos.org/car-logos/honda-logo.png"> Honda</button>
            <button class="brand-btn" onclick="filterByBrand('Hyundai')"><img src="https://www.carlogos.org/car-logos/hyundai-logo.png"> Hyundai</button>
            <button class="brand-btn" onclick="filterByBrand('Mazda')"><img src="https://www.carlogos.org/car-logos/mazda-logo.png"> Mazda</button>
            <button class="brand-btn" onclick="filterByBrand('Geely')"><img src="https://www.carlogos.org/car-logos/geely-logo.png"> Geely</button>
        </div>

        <div id="categoryGrid" class="grid"></div>
    </div>
</div>

<button onclick="openAdmin()" class="admin-trigger"></button>

<script>
    const API_BASE = "https://ar-store-i6tw.onrender.com";
    let products = [];
    let currentView = 'home';
    let currentBrand = 'all';
    let currentCurr = 'SR';
    const rates = { "SR": 1, "USD": 0.27, "EUR": 0.25 };

    const brandLogos = {
        'Bmw': 'https://www.carlogos.org/car-logos/bmw-logo.png',
        'Mercedes': 'https://www.carlogos.org/car-logos/mercedes-benz-logo.png',
        'Toyota': 'https://www.carlogos.org/car-logos/toyota-logo.png',
        'Lexus': 'https://www.carlogos.org/car-logos/lexus-logo.png',
        'Nissan': 'https://www.carlogos.org/car-logos/nissan-logo.png',
        'Ford': 'https://www.carlogos.org/car-logos/ford-logo.png',
        'Chevrolet': 'https://www.carlogos.org/car-logos/chevrolet-logo.png',
        'Kia': 'https://www.carlogos.org/car-logos/kia-logo.png',
        'Doge': 'https://www.carlogos.org/car-logos/dodge-logo.png',
        'Rose Roes': 'https://www.carlogos.org/car-logos/rolls-royce-logo.png',
        'Honda': 'https://www.carlogos.org/car-logos/honda-logo.png',
        'Hyundai': 'https://www.carlogos.org/car-logos/hyundai-logo.png',
        'Mazda': 'https://www.carlogos.org/car-logos/mazda-logo.png',
        'Geely': 'https://www.carlogos.org/car-logos/geely-logo.png'
    };

    // --- المؤشر ---
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    async function loadData() {
        try {
            const res = await fetch(`${API_BASE}/get-store-data`);
            const data = await res.json();
            products = data.products || [];
            render();
        } catch (e) { console.error("Database Error"); }
    }

    function render() {
        const bestGrid = document.getElementById('bestSellerGrid');
        const catGrid = document.getElementById('categoryGrid');
        const now = new Date().getTime();
        
        bestGrid.innerHTML = '';
        catGrid.innerHTML = '';

        // ترتيب الشركات إذا كان الخيار "الكل"
        const companies = currentBrand === 'all' ? Object.keys(brandLogos) : [currentBrand];

        if (currentView === 'home') {
            products.filter(p => p.sales > 0 || (p.discount && p.discount.expiry > now)).forEach(p => {
                bestGrid.innerHTML += generateCard(p);
            });
        } else if (currentView === 'الـسيارات🚗') {
            companies.forEach(brand => {
                const brandProducts = products.filter(p => p.category === 'الـسيارات🚗' && p.brand === brand);
                if (brandProducts.length > 0) {
                    catGrid.innerHTML += `
                        <div class="company-header">
                            <img src="${brandLogos[brand]}">
                            <h3>${brand}</h3>
                        </div>
                        <div class="grid">${brandProducts.map(p => generateCard(p)).join('')}</div>
                    `;
                }
            });
        } else {
            products.filter(p => p.category === currentView).forEach(p => {
                catGrid.innerHTML += generateCard(p);
            });
        }
    }

    function generateCard(p) {
        const now = new Date().getTime();
        const hasDisc = p.discount && p.discount.expiry > now;
        const finalPrice = hasDisc ? p.price * (1 - p.discount.percent/100) : p.price;
        const convPrice = (finalPrice * rates[currentCurr]).toFixed(2);
        
        return `
            <div class="card ${p.stock <= 0 ? 'out-of-stock' : ''}">
                ${hasDisc ? `<div class="discount-badge">خصم ${p.discount.percent}%</div>` : ''}
                <img src="${p.img || 'https://via.placeholder.com/300x180'}">
                <div class="card-content">
                    <h3>${p.name}</h3>
                    <div class="price">
                        ${hasDisc ? `<span class="old-price">${(p.price * rates[currentCurr]).toFixed(2)}</span>` : ''}
                        ${convPrice} ${currentCurr}
                    </div>
                    <button class="buy-btn" onclick="alert('طلب: ${p.name}')">${p.stock <= 0 ? 'نفذت' : 'شراء'}</button>
                </div>
            </div>
        `;
    }

    function showSection(s) {
        currentView = s;
        currentBrand = 'all';
        document.getElementById('homeSection').style.display = (s === 'home' ? 'block' : 'none');
        document.getElementById('categorySection').style.display = (s === 'home' ? 'none' : 'block');
        document.getElementById('categoryTitle').innerText = s.replace(/🚗|🏘️|🏪/g, '');
        document.getElementById('carBrandsFilterBox').style.display = (s === 'الـسيارات🚗' ? 'flex' : 'none');
        
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        render();
    }

    function filterByBrand(b) {
        currentBrand = b;
        document.querySelectorAll('.brand-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    async function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const category = document.getElementById('pCategory').value;
        const brand = (category === 'الـسيارات🚗') ? document.getElementById('pCarBrand').value : 'none';
        const stock = document.getElementById('pStock').value;
        const img = document.getElementById('pImg').value;

        products.push({ name, price: parseFloat(price), category, brand, stock: parseInt(stock), img, sales: 0 });
        
        await fetch(`${API_BASE}/save-products`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ products })
        });
        render();
        alert("تم الحفظ!");
    }

    function applyAdvancedDiscount() {
        const scope = document.getElementById('discScope').value;
        const percent = parseInt(document.getElementById('discPercent').value);
        const hours = parseFloat(document.getElementById('discHours').value);
        const expiry = new Date().getTime() + (hours * 3600000);

        products.forEach(p => {
            if (scope === 'all' || p.category === scope || p.brand === scope) {
                p.discount = { percent, expiry };
            }
        });
        render();
        alert("تم تفعيل الخصم!");
    }

    function toggleAdminCarBrand() {
        const cat = document.getElementById('pCategory').value;
        document.getElementById('pCarBrand').style.display = (cat === 'الـسيارات🚗' ? 'block' : 'none');
    }

    function openAdmin() { if(prompt("الباسورد:") === "admin123") document.getElementById('adminSection').style.display = 'block'; }
    function closeAdmin() { document.getElementById('adminSection').style.display = 'none'; }
    function updateCurrency() { currentCurr = document.getElementById('currSelect').value; render(); }

    window.onload = loadData;
</script>

</body>
</html>
