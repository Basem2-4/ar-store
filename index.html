<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر AR | الإصدار الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --black: #0a0a0a; --card-bg: #151515; --nav-bg: #111; --discount-red: #ff4d4d; }
        
        /* --- المؤشر الذهبي --- */
        * { cursor: none !important; }
        #custom-cursor {
            position: fixed; width: 30px; height: 30px;
            background: url('https://cdn.discordapp.com/attachments/1433835949405503591/1454504136627454123/7PFOzAO.webp?ex=6951fcc9&is=6950ab49&hm=06c92d1f36ec2d4867c5c01c27adb4e98709fd46be2a30838a8f7e4d7a37a5fb&') no-repeat center;
            background-size: contain; pointer-events: none; z-index: 9999999;
            transform: translate(-50%, -50%); filter: drop-shadow(0 0 5px #D4AF37) brightness(1.2);
            transition: transform 0.1s ease-out;
        }

        body { background: var(--black); color: white; font-family: 'Cairo', sans-serif; margin: 0; padding-top: 80px; overflow-x: hidden; }

        /* --- الهيدر والقوائم --- */
        nav { 
            position: fixed; top: 0; width: 100%; background: var(--nav-bg); 
            border-bottom: 2px solid var(--gold); display: flex; justify-content: center; 
            align-items: center; gap: 20px; padding: 15px 0; z-index: 9000;
        }
        nav a { color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s; padding: 8px 15px; border-radius: 5px; }
        nav a:hover, nav a.active { color: var(--gold); background: rgba(212,175,55,0.1); }

        /* --- تعديل قائمة العملات حسب طلبك --- */
        .currency-container {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 5px 15px;
            border-radius: 50px; border: 1px solid rgba(212, 175, 55, 0.3);
        }
        #currSelect { 
            background: #1a1a1a; /* خلفية داكنة */
            color: var(--gold); /* نص ذهبي */
            border: 1px solid var(--gold); 
            font-family: 'Cairo'; 
            font-weight: 700; 
            padding: 2px 8px;
            border-radius: 5px;
            outline: none;
        }
        #currSelect option { background: #111; color: white; }

        .container { max-width: 1100px; margin: auto; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; clear: both; }

        /* --- الكروت --- */
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.4s; }
        .card img { width: 100%; height: 140px; object-fit: cover; } 
        .card-content { padding: 10px; text-align: center; }
        .card-content h3 { font-size: 0.95rem; margin: 8px 0; color: #eee; }

        .price { color: var(--gold); font-size: 1rem; font-weight: 700; }
        .old-price { text-decoration: line-through; color: #777; font-size: 0.75rem; margin-left: 5px; }

        .buy-btn { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; font-weight: 800; border-radius: 8px; margin-top: 8px; transition: 0.3s; font-size: 0.85rem; }
        .buy-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        /* --- أزرار الإدارة داخل الكرت --- */
        .admin-controls { display: flex; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
        .edit-p-btn { flex: 1; background: #222; color: #3498db; border: 1px solid #3498db; padding: 5px; border-radius: 5px; font-size: 11px; }
        .delete-p-btn { flex: 1; background: #222; color: #e74c3c; border: 1px solid #e74c3c; padding: 5px; border-radius: 5px; font-size: 11px; }

        /* --- لوحة التحكم --- */
        #adminSection { display: none; background: #111; border: 1px solid var(--gold); padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        .admin-input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }

        .section-header h2 { color: var(--gold); border-right: 4px solid var(--gold); padding-right: 15px; margin: 30px 0; }

        /* --- المودال --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid var(--gold); width: 90%; max-width: 380px; text-align: center; }

        @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div id="custom-cursor"></div>

<nav>
    <a href="#" onclick="showSection('home')" id="nav-home" class="active">الرئيسية</a>
    <a href="#" onclick="showSection('الـسيارات🚗')">سيارات</a>
    <a href="#" onclick="showSection('الـعـقارات🏘️')">عقارات</a>
    <a href="#" onclick="showSection('الـمـتاجـر🏪')">متاجر</a>
    <div class="currency-container">
        <select id="currSelect" onchange="updateCurrency()">
            <option value="SR">SR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="KWD">KWD</option>
        </select>
    </div>
</nav>

<div class="container">
    <div id="adminSection">
        <h3 style="color:var(--gold)">⚙️ لوحة تحكم المتجر</h3>
        <input type="hidden" id="editIndex" value="">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="text" id="pName" class="admin-input" placeholder="اسم المنتج">
            <input type="number" id="pPrice" class="admin-input" placeholder="السعر (SR)">
            <select id="pCategory" class="admin-input">
                <option value="الـسيارات🚗">سيارات</option>
                <option value="الـعـقارات🏘️">عقارات</option>
                <option value="الـمـتاجـر🏪">متاجر</option>
            </select>
            <input type="number" id="pStock" class="admin-input" placeholder="المخزون">
            <input type="text" id="pImg" class="admin-input" placeholder="رابط الصورة">
            <button onclick="saveProduct()" class="buy-btn">حفظ المنتج ✅</button>
        </div>
        <button onclick="closeAdmin()" class="buy-btn" style="background:#333; color:white; margin-top:10px;">إغلاق</button>
    </div>

    <div id="homeSection">
        <div class="section-header"><h2>الأكثر مبيعاً 🔥</h2></div>
        <div class="grid" id="bestSellerGrid"></div>
    </div>

    <div id="categorySection" style="display:none;">
        <div class="section-header"><h2 id="categoryTitle"></h2></div>
        <div class="grid" id="categoryGrid"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content" id="modalMain">
        <h3 id="modalTitle" style="color:var(--gold)"></h3>
        <input type="text" id="orderDiscord" class="admin-input" placeholder="ايدي ديسكوردك (123456...)">
        <input type="number" id="orderQty" class="admin-input" value="1" min="1">
        <button onclick="goToPayment()" class="buy-btn">تأكيد الطلب</button>
        <button onclick="closeModal()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">إلغاء</button>
    </div>
    <div class="modal-content" id="paymentScreen" style="display:none;">
        <h3 style="color:var(--gold)">تأكيد الدفع</h3>
        <p>قم بمسح الكود لإتمام الدفع</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=AR_STORE_PAY" style="background:white; padding:10px; border-radius:10px;">
        <button onclick="finishOrder()" class="buy-btn" id="finalBtn">لقد دفعت، فتح تذكرة ✅</button>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:20px; left:20px; width:45px; height:45px; border-radius:50%; background:#111; border:1px solid var(--gold); color:var(--gold); z-index:10000;">⚙️</button>

<script>
    const BOT_URL = "https://ar-store-i6tw.onrender.com/open-ticket";
    let products = JSON.parse(localStorage.getItem('ar_store_v13')) || [];
    let currentCurr = "SR";
    let currentView = "home";
    let currentIndex = null;
    const rates = { "SR": 1, "USD": 0.27, "EUR": 0.25, "KWD": 0.082 };

    // تحريك المؤشر
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    function render() {
        const bestGrid = document.getElementById('bestSellerGrid');
        const catGrid = document.getElementById('categoryGrid');
        const isAdminVisible = document.getElementById('adminSection').style.display === 'block';
        
        bestGrid.innerHTML = ''; catGrid.innerHTML = '';

        products.forEach((p, i) => {
            const price = (p.price * rates[currentCurr]).toFixed(2);
            const isOut = p.stock <= 0;

            const cardHtml = `
                <div class="card">
                    <img src="${p.img || 'https://via.placeholder.com/150'}">
                    <div class="card-content">
                        <h3>${p.name}</h3>
                        <div class="price">${price} ${currentCurr}</div>
                        <p style="font-size:11px; color:gray;">المخزون: ${p.stock}</p>
                        <button class="buy-btn" ${isOut ? 'disabled' : ''} onclick="openOrder(${i})">
                            ${isOut ? 'نفذت الكمية' : 'اطلب الآن'}
                        </button>
                        ${isAdminVisible ? `
                            <div class="admin-controls">
                                <button class="edit-p-btn" onclick="editP(${i})">تعديل</button>
                                <button class="delete-p-btn" onclick="deleteP(${i})">حذف</button>
                            </div>
                        ` : ''}
                    </div>
                </div>`;

            if (currentView === 'home' && p.sales > 0) bestGrid.innerHTML += cardHtml;
            if (p.category === currentView) catGrid.innerHTML += cardHtml;
        });
    }

    function saveProduct() {
        const idx = document.getElementById('editIndex').value;
        const newP = {
            name: document.getElementById('pName').value,
            price: parseFloat(document.getElementById('pPrice').value),
            category: document.getElementById('pCategory').value,
            stock: parseInt(document.getElementById('pStock').value),
            img: document.getElementById('pImg').value,
            sales: (idx !== "" && products[idx]) ? products[idx].sales : 0
        };

        if (!newP.name || isNaN(newP.price)) return alert("أدخل البيانات بشكل صحيح");

        if (idx === "") products.push(newP);
        else products[idx] = newP;

        saveAll();
        document.getElementById('editIndex').value = "";
        alert("تم الحفظ بنجاح ✅");
    }

    function deleteP(i) {
        if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            products.splice(i, 1);
            saveAll();
        }
    }

    function editP(i) {
        const p = products[i];
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCategory').value = p.category;
        document.getElementById('pStock').value = p.stock;
        document.getElementById('pImg').value = p.img;
        document.getElementById('editIndex').value = i;
        window.scrollTo(0, 0);
    }

    async function finishOrder() {
        const p = products[currentIndex];
        const qty = parseInt(document.getElementById('orderQty').value);
        const buyerId = document.getElementById('orderDiscord').value;
        
        const btn = document.getElementById('finalBtn');
        btn.disabled = true; btn.innerText = "جاري فتح تذكرة...";

        try {
            const res = await fetch(BOT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    productName: p.name,
                    buyerId: buyerId,
                    qty: qty,
                    total: (p.price * qty)
                })
            });
            const data = await res.json();
            if (data.success) {
                p.stock -= qty;
                p.sales = (p.sales || 0) + qty;
                saveAll();
                alert("تم فتح التذكرة بنجاح في الديسكورد! ✅");
                closeModal();
            } else { alert("خطأ: " + data.error); }
        } catch (e) { alert("البوت لا يستجيب حالياً."); }
        btn.disabled = false; btn.innerText = "لقد دفعت، فتح تذكرة ✅";
    }

    function saveAll() {
        localStorage.setItem('ar_store_v13', JSON.stringify(products));
        render();
    }

    function openAdmin() {
        if (prompt("كلمة المرور:") === "admin123") {
            document.getElementById('adminSection').style.display = 'block';
            render();
        }
    }

    function closeAdmin() {
        document.getElementById('adminSection').style.display = 'none';
        render();
    }

    function showSection(s) {
        currentView = s;
        document.getElementById('homeSection').style.display = (s === 'home' ? 'block' : 'none');
        document.getElementById('categorySection').style.display = (s === 'home' ? 'none' : 'block');
        if (s !== 'home') document.getElementById('categoryTitle').innerText = `قسم ${s}`;
        render();
    }

    function openOrder(i) {
        currentIndex = i;
        document.getElementById('modalTitle').innerText = products[i].name;
        document.getElementById('orderModal').style.display = 'flex';
        document.getElementById('modalMain').style.display = 'block';
        document.getElementById('paymentScreen').style.display = 'none';
    }

    function goToPayment() {
        if (!document.getElementById('orderDiscord').value) return alert("يرجى إدخال ايدي الديسكورد");
        document.getElementById('modalMain').style.display = 'none';
        document.getElementById('paymentScreen').style.display = 'block';
    }

    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
    function updateCurrency() { currentCurr = document.getElementById('currSelect').value; render(); }

    render();
</script>

</body>
</html>
